name: Morning bias report

on:
  schedule:
    # Pre-open: every 15 min from 12:07 to 14:52 UTC, which covers 8:07 to 9:22 ET in both
    # daylight and standard time. Off-hour minutes start sooner; GitHub runs at :00 lag the most.
    - cron: "7,22,37,52 12,13,14 * * 1-5"
    - cron: "40 * * * 0-5"   # hourly, around the clock: keeps the Now read and its grading current
    # Before the 5 PM CT Globex reopen, Sunday to Thursday: builds the evening Now call and the Sunday
    # gap call ahead of the open (20-22 UTC covers 3:20 to 5:50 PM ET in standard time, 4:20 to 6:50 PM in daylight)
    - cron: "20,50 20,21,22 * * 0-4"
  workflow_dispatch:
    inputs:
      date:
        description: "Rebuild a past morning (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Build report
        env:
          REPORT_DATE: ${{ github.event.inputs.date }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_report.py
      - name: Publish
        run: |
          git config user.name  "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Report $(date -u +%Y-%m-%d\ %H:%M)Z"
          git pull --rebase
          git push
