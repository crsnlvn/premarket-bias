<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-Market Bias</title>
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bias">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#05070d; --text:#f4f6fb; --sub:rgba(235,240,250,.74); --dim:rgba(235,240,250,.52); --faint:rgba(235,240,250,.34);
  --glass:rgba(255,255,255,.07); --edge:rgba(255,255,255,.15); --hi:rgba(255,255,255,.22); --sel:rgba(255,255,255,.15);
  --row:rgba(255,255,255,.07); --track:rgba(0,0,0,.28); --bar:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.35); --solid:rgba(16,19,28,.9);
  --up:#5ef2b0; --down:#ff6b8b; --flat:#a7b0c0; --amber:#ffc35a; --accent:#ffffff;
  --blob1:rgba(255,107,139,.5); --blob2:rgba(60,110,255,.42); --blob3:rgba(0,200,170,.2);
  --sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif; --mono:var(--sans);
  --pad:16px; --gap:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
html,body{color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 100px);min-height:100vh}
body{position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;transition:background 1.2s ease;
  background:radial-gradient(42% 32% at 12% 30%,var(--blob1),transparent 70%),radial-gradient(48% 36% at 95% 4%,var(--blob2),transparent 70%),
             radial-gradient(40% 30% at 90% 78%,var(--blob3),transparent 70%)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;display:block}
#fx[hidden]{display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num,.stamps,.rows .r > span:last-child,.ev .t,.big b,.fl{font-variant-numeric:tabular-nums}

/* glass */
.g,.card,.hero,.tabbar,.glass,.sheet,.toast,.big > div{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 12px 40px var(--shadow)}

/* header */
header{padding:12px 0 2px}
.top,.row2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2{margin-top:10px}
.btns{display:flex;gap:8px}
.segc{display:flex;padding:3px;border-radius:999px;gap:2px}
.segc button{font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s}
.segc button.on{color:var(--text);background:var(--sel);box-shadow:inset 0 1px 0 var(--hi)}
.tab .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.ib svg{width:18px;height:18px}
.spin svg{animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.brand{display:none}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.live.stale{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.ptitle{font-size:34px;font-weight:700;letter-spacing:-.04em;margin:22px 4px 4px}
.psub{font-size:14px;color:var(--dim);line-height:1.5;margin:0 4px}

/* hero */
.hero{margin-top:16px;border-radius:30px;padding:20px 20px 18px}
.kicker{font-size:13.5px;color:var(--dim);font-weight:500;display:flex;align-items:center;gap:8px}
.bias{font-size:62px;font-weight:700;letter-spacing:-.045em;line-height:1.02;margin:8px 0 8px;
  background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 68%,var(--text)));-webkit-background-clip:text;background-clip:text;color:transparent}
.conv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--sel);border:1px solid var(--edge)}
.tug{margin-top:22px}
.track{position:relative;display:flex;height:22px;border-radius:999px;padding:4px;background:var(--track);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.side{width:50%;display:flex;gap:2px}
.side.bear{flex-direction:row-reverse;padding-right:3px}
.side.bull{padding-left:3px}
.side i{display:block;height:100%;border-radius:999px}
.needle{position:absolute;top:-6px;bottom:-6px;width:8px;margin-left:-4px;border-radius:999px;background:var(--text);
  box-shadow:0 0 0 3px var(--sel),0 2px 10px rgba(0,0,0,.4);animation:nd .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes nd{from{left:50%}}
.tl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:10px;font-weight:500}
.note{font-size:15.5px;color:var(--sub);margin-top:16px;line-height:1.5}
.note b{color:var(--text);font-weight:600}
.flipv{margin-top:12px;font-size:13.5px;color:var(--sub);padding:10px 12px;border-radius:14px;background:var(--bar)}
.mode{font-size:13px;color:var(--dim);margin-top:14px;line-height:1.5}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--row)}
.stamps div{font-size:13.5px;font-weight:600}
.stamps span{display:block;font-size:12px;color:var(--faint);font-weight:500}
.stamps em{display:block;font-style:normal;font-size:12px;color:var(--dim);font-weight:500}
.stamps .warn{grid-column:1/-1;color:var(--amber)}
.flash{animation:fl 1.2s ease}
@keyframes fl{0%{opacity:.35}100%{opacity:1}}

/* blocks */
section{margin-top:var(--gap)}
h2{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:0 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card{border-radius:24px;overflow:hidden}
.pad{padding:var(--pad)}
.idea{font-size:15.5px;line-height:1.5}
.inval{margin-top:12px;font-size:14px;color:var(--dim)}
.inval b{color:var(--text);font-weight:600}
.pill{font-size:12.5px;font-weight:600;letter-spacing:0;padding:4px 10px;border-radius:999px;background:var(--sel);border:1px solid var(--edge);white-space:nowrap}
.grp{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--dim);padding:14px var(--pad) 4px}
.grp span:last-child{font-weight:500;color:var(--faint)}
.sig{padding:12px var(--pad);border-top:1px solid var(--row)}
.grp + .sig{border-top:0}
.sig-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sig h3{font-size:15.5px;font-weight:600}
.sig p{font-size:13.5px;line-height:1.45;color:var(--dim);margin-top:3px}
.w{font-size:12px;color:var(--faint);margin-left:6px;font-weight:500}
.vbar{flex:none;position:relative;width:70px;height:6px;border-radius:999px;background:var(--bar)}
.vbar i{position:absolute;top:0;bottom:0;border-radius:999px}
.ico{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid;display:grid;place-items:center;font-size:13px;font-weight:700}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px var(--pad);border-top:1px solid var(--row);font-size:15px}
.rows .r:first-child{border-top:0}
.rows .r > span:first-child{color:var(--sub)}
.rows .r > span:last-child{font-weight:600;text-align:right}
.rows small{display:block;font-size:12px;color:var(--faint);font-weight:500}
.flowbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:4px 0 8px;gap:2px}
.fl{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
svg.prof{display:block;width:100%;height:150px}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);gap:6px}
.ev{display:flex;gap:14px;padding:12px var(--pad);border-top:1px solid var(--row);font-size:15px}
.ev:first-child{border-top:0}
.ev .t{color:var(--dim);width:68px;flex:none;font-weight:500}
.ev small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.dayhead{font-size:13px;font-weight:600;color:var(--dim);padding:14px var(--pad) 2px;border-top:1px solid var(--row)}
.card > .dayhead:first-child{border-top:0}
.dayhead.today{color:var(--text)}
.imp{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.foot{font-size:13px;line-height:1.6;color:var(--dim);margin:0 4px}
.foot p{margin-bottom:10px}
.foot b{color:var(--sub);font-weight:600}
.err{color:var(--amber);font-size:13px;line-height:1.6}
.empty{padding:80px 4px;color:var(--dim);font-size:16px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:999px;background:var(--sel);border:1px solid var(--edge);font-size:15px;font-weight:600}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}

/* record */
.big{display:flex;gap:10px}
.big > div{flex:1;border-radius:24px;padding:16px}
.big b{display:block;font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:4px}
.big span{font-size:13px;font-weight:600;color:var(--dim)}
.big small{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}
.bar{height:6px;border-radius:999px;background:var(--bar);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:999px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:var(--pad)}
.dots span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#05070d;font-weight:700}

/* research */
details.rs{border-top:1px solid var(--row)}
.card > details.rs:first-child{border-top:0}
details.rs summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px var(--pad);cursor:pointer}
details.rs summary::-webkit-details-marker{display:none}
details.rs summary h3{flex:1;font-size:15.5px;font-weight:600}
details.rs summary em{font-style:normal;font-size:16px;color:var(--faint);transition:transform .2s}
details.rs[open] summary em{transform:rotate(90deg)}
.rsb{padding:0 var(--pad) 16px 50px;font-size:14px;line-height:1.55;color:var(--sub)}
.rsb p{margin-top:8px}
.rsb b{color:var(--text);font-weight:600}
.rsb .paper{font-size:12.5px;color:var(--dim)}

/* journal */
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--track);border:1px solid var(--edge);border-radius:14px;padding:11px 13px;font-size:16px}
.field textarea{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{flex:1;min-width:80px;font-size:14px;font-weight:600;padding:10px 6px;border-radius:999px;color:var(--dim);background:var(--bar);border:1px solid transparent}
.chips button.on{color:var(--text);background:var(--sel);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.jrow{padding:12px var(--pad);border-top:1px solid var(--row);font-size:14.5px}
.jrow:first-child{border-top:0}
.jrow .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--dim)}
.jrow p{margin-top:6px;color:var(--sub);line-height:1.5}
.jrow .del{color:var(--faint);font-size:13px;margin-top:6px}

/* floating tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:12;
  width:calc(100% - 32px);max-width:528px;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--solid)}
.tabbar button{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--dim);padding:10px 0;border-radius:999px;transition:background .2s,color .2s}
.tabbar button svg{display:none}
.tabbar button.on{color:var(--text);background:var(--sel);box-shadow:inset 0 1px 0 var(--hi)}

/* "More" panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.glass{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:22;width:calc(100% - 32px);max-width:528px;
  transform:translate(-50%,16px) scale(.97);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.8,.2,1);
  padding:8px 18px 6px;border-radius:28px;background:var(--solid)}
.glass.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.glass h4{font-size:13px;font-weight:600;color:var(--dim);margin:8px 0 2px;display:flex;justify-content:space-between}
.tiles{display:flex;flex-direction:column}
.tiles button{display:flex;align-items:center;gap:12px;padding:13px 0;text-align:left;border-top:1px solid var(--row)}
.tiles button:first-child{border-top:0}
.tiles svg{width:20px;height:20px;color:var(--dim);flex:none}
.tiles span{display:flex;justify-content:space-between;align-items:baseline;width:100%;gap:12px}
.tiles b{font-size:16px;font-weight:600}
.tiles small{font-size:13px;color:var(--dim)}
.tiles button.on svg,.tiles button.on b{color:var(--text)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--solid);color:var(--text);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}

/* compact layout */
body.compact{--pad:12px;--gap:18px}
body.compact .sig p{display:none}
body.compact .sig{padding-top:10px;padding-bottom:10px}
body.compact .bias{font-size:50px}
body.compact .note{font-size:14.5px}

/* settings sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;background:var(--solid);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:25;padding:0 0 calc(env(safe-area-inset-bottom) + 20px)}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto;padding:0 18px}
.sh-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px;z-index:1;background:linear-gradient(var(--solid) 80%,transparent)}
.sh-top h3{font-size:24px;font-weight:700;letter-spacing:-.03em}
.hbtn{font-size:15px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--sel);border:1px solid var(--edge)}
.st{margin-top:20px}
.st h4{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:70px;font-size:14px;font-weight:600;padding:10px 8px;border-radius:999px;color:var(--dim);background:var(--bar);border:1px solid transparent}
.seg button.on{color:var(--text);background:var(--sel);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.sw{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}
.sw i{width:10px;height:10px;border-radius:50%;display:inline-block}
.colors{display:flex;gap:8px;margin-top:8px}
.colors label{flex:1;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--dim);border-radius:999px;padding:6px 8px 6px 14px;background:var(--bar)}
.colors input{width:30px;height:24px;border:0;background:none;padding:0}
.secrow{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--row);font-size:15px}
.secrow:first-child{border-top:0}
.secrow span{flex:1}
.mv{width:32px;height:32px;border-radius:50%;color:var(--dim);font-size:14px;background:var(--bar)}
.tg{width:48px;height:28px;border-radius:999px;background:var(--bar);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s}
.tg.on{background:var(--up)}
.tg.on::after{transform:translateX(20px)}
.rng{display:grid;gap:4px}
.rng label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--dim);margin-top:8px}
.rng output{color:var(--text);font-variant-numeric:tabular-nums}
.rng input[type=range]{width:100%;height:28px;accent-color:var(--text)}
.reset{width:100%;margin-top:20px;padding:13px;border-radius:999px;color:var(--down);font-size:15px;font-weight:600;background:var(--bar)}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true" hidden></canvas>
<div class="wrap" id="wrap">
  <header>
    <div class="brand"><span class="live" id="live"></span></div>
    <div class="top">
      <div class="segc g" id="tabs"></div>
      <div class="btns">
        <button class="ib g" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
        <button class="ib g" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </div>
    <div class="row2"><div class="segc g" id="sess"><button data-s="ny" class="on">NY</button><button data-s="overnight">Overnight</button></div>
      <div class="segc g" id="vt"><button data-view="preopen" class="on">Pre-open</button><button data-view="now">Now</button></div></div>
  </header>
  <main id="app"><div class="empty">Loading…</div></main>
</div>

<nav class="tabbar" id="tabbar"></nav>
<div class="scrim" id="scrim"></div>
<div class="glass" id="glass"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = (n,d=2) => n==null||isNaN(n) ? '—' : Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = (n,d=2) => n==null||isNaN(n) ? '—' : (n<0?'−':'')+'$'+fmt(Math.abs(n),d);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = b => ({Bullish:'var(--up)',Bearish:'var(--down)',Neutral:'var(--flat)'}[b]);
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

/* ───────── icons ───────── */
const I = {

if(!BGS[P.bg]) P.bg = 'auto';

const sysDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function modeNow(){
  if(P.fx && P.fx!=='off') return 'dark';   // the animated scenes are night skies, so the glass goes dark with them
  return P.bg==='auto' ? (sysDark && !sysDark.matches ? 'light' : 'dark') : BGS[P.bg].mode; }
function shade(hex, amt){ // mix a color toward black so it reads on light glass
  const n=parseInt(hex.slice(1),16), f=c=>Math.round(c*(1-amt)).toString(16).padStart(2,'0');
  return '#'+f(n>>16&255)+f(n>>8&255)+f(n&255);
}
let CALL = null;   // Bullish / Bearish of the read on screen: tints the ambient glow
function applyPrefs(){
  const r = document.documentElement.style, t = THEMES[P.theme]||THEMES.classic, mode = modeNow();
  const b = P.bg==='auto' ? BGS[mode] : BGS[P.bg];
  for(const [k,v] of Object.entries(MODE[mode])) r.setProperty('--'+k, v);
  r.setProperty('--bg', b.bg); r.setProperty('--blob2', b.blob2); r.setProperty('--blob3', b.blob3);
  let up = P.up||t.up, down = P.down||t.down;
  if(mode==='light'){ up = shade(up,.38); down = shade(down,.18); }
  r.setProperty('--up', up); r.setProperty('--down', down); r.setProperty('--accent', up);
  const glow = CALL==='Bearish' ? down : CALL==='Bullish' ? up : null;
  r.setProperty('--blob1', glow ? `color-mix(in srgb, ${glow} ${mode==='light'?45:50}%, transparent)` : 'transparent');
  document.documentElement.dataset.mode = mode;
  document.querySelector('meta[name=theme-color]').content = b.bg;
  document.body.classList.toggle('compact', P.density==='compact');
  $('#wrap').style.zoom = {s:.9, m:1, l:1.12}[P.size] || 1;
  try { FX.config(P, CALL); } catch(e) {}
}
if(sysDark) (sysDark.addEventListener ? sysDark.addEventListener('change',()=>{ if(P.bg==='auto') applyPrefs(); }) : sysDark.addListener(()=>{ if(P.bg==='auto') applyPrefs(); }));

/* ───────── time helpers ───────── */
const tET = d => d.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'})+' ET';
const tLocal = (d,sec) => d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',...(sec?{second:'2-digit'}:{})});
const dayLocal = d => d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dayOf = iso => new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
function ago(d){
  const m = Math.round((Date.now()-d)/60000);
  if(m<1) return 'just now'; if(m<60) return m+' min ago';
  const h=Math.floor(m/60); if(h<24) return h+' hr '+(m%60)+' min ago';
  const dd=Math.floor(h/24); return dd+' day'+(dd>1?'s':'')+' ago';
}
function nextRun(){   // mirrors the GitHub schedule (UTC): weekdays 12:10 and 13:10, plus every hour at :40 Sun–Fri
  const now=new Date(), slots=[...Array(24).keys()].map(h=>[h,40]).concat([[12,10],[13,10]]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  for(let i=0;i<10;i++) for(const [h,mi] of slots){
    const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+i,h,mi)), wd=d.getUTCDay();
    if(mi===10 ? (wd>=1&&wd<=5) : wd<=5) if(d>now) return d;
  }
}
const winName = D => (D && D.window && D.window.name) || 'NY open';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2800); }
const arrow = b => ({
  Bullish:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 18L18 6M9 6h9v9"/></svg>',
  Bearish:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 9v9H9"/></svg>',
  Neutral:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 12h16M15 7l5 5-5 5"/></svg>'}[b]);

/* ───────── state ───────── */
let ROOT=null, SYM=P.market, CHECKED=null, VIEW='preopen', SESSION='ny', PAGE='today';

function readFor(sess=SESSION, view=VIEW){
  if(!ROOT) return null;
  if(!ROOT.ny) return ROOT.preopen ? ((view==='now'&&ROOT.now)||ROOT.preopen) : ROOT;   // older formats
  if(sess==='overnight') return ROOT.overnight;
  return (view==='now' && ROOT.ny.now) ? ROOT.ny.now : ROOT.ny.preopen;
}

async function load(manual){
  $('#refresh').classList.add('spin');
  const before = ROOT && ROOT.generated; let ok=false;
  try{
    const r = await fetch('data/latest.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    ROOT = await r.json(); ok=true; CHECKED=new Date();
  }catch(e){ if(!ROOT) $('#app').innerHTML='<div class="empty">No report yet. The first one arrives with the next run.</div>'; }
  $('#refresh').classList.remove('spin');
  if(ROOT) render();
  if(manual){
    const n=nextRun();
    if(!ok) toast('Could not reach the server. Showing the last report.');
    else if(before && before!==ROOT.generated) toast('New data loaded');
    else toast('Up to date. Next update '+dayLocal(n)+' at '+tLocal(n)+'.');
    const c=$('#checkedRow'); if(c){ c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
  }
}
setInterval(()=>{ const D=readFor(); if(!D) return;
  const a=$('#agoTxt'); if(a) a.textContent=ago(new Date(D.generated));
  const c=$('#chkAgo'); if(c&&CHECKED) c.textContent=ago(CHECKED); }, 30000);

/* ───────── shell ───────── */
function shell(){
  const D = readFor();
  const call = D && D.markets[SYM] ? D.markets[SYM].bias.bias : null;
  if(call !== CALL){ CALL = call; applyPrefs(); }
  // header: market tabs, session switch, Pre-open/Now only where it applies
  const syms = D ? Object.keys(D.markets) : ['NQ','ES'];
  if(!syms.includes(SYM)) SYM = syms[0];
  $('#tabs').innerHTML = syms.map(s=>`<button class="tab ${s===SYM?'on':''}" data-s="${s}">${s}${D?`<span class="dot" style="background:${C(D.markets[s].bias.bias)}"></span>`:''}</button>`).join('');
  $$('#tabs .tab').forEach(t=>t.onclick=()=>{SYM=t.dataset.s;render();window.scrollTo({top:0})});
  const sessUsed = ['today','levels','record'].includes(PAGE);
  $('#sess').style.display = sessUsed && ROOT && ROOT.ny ? '' : 'none';
  $$('#sess button').forEach(b=>b.classList.toggle('on', b.dataset.s===SESSION));
  $('#vt').style.display = (SESSION==='ny' && ['today','levels','record'].includes(PAGE)) ? '' : 'none';
  $$('#vt button').forEach(b=>b.classList.toggle('on', b.dataset.view===VIEW));
  $('.brand').innerHTML = `<span class="live ${D && D.date!==todayET() && SESSION==='ny' ? 'stale':''}" id="live"></span><b>${SESSION==='overnight'?'Overnight':VIEW==='now'?esc(winName(D)):'NY open'}</b> Bias`;
  // tab bar
  $('#tabbar').innerHTML = BAR.map(k=>`<button data-p="${k}" class="${PAGE===k?'on':''}">${I[k]}${PAGES[k].name}</button>`).join('')
    + `<button data-p="all" class="${!BAR.includes(PAGE)?'on':''}">${I.all}More</button>`;
  $$('#tabbar button').forEach(b=>b.onclick=()=> b.dataset.p==='all' ? openGlass() : go(b.dataset.p));
}
const todayET = () => new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
function go(p){ PAGE=p; closeGlass(); render(); window.scrollTo({top:0}); }

function openGlass(){
  $('#glass').innerHTML = `<h4><span>Pages</span><span>${esc(SYM)}, ${SESSION==='overnight'?'overnight':VIEW==='now'?esc(winName(readFor()))+' session':'NY open'}</span></h4><div class="tiles">${
    Object.entries(PAGES).map(([k,v])=>`<button data-p="${k}" class="${PAGE===k?'on':''}">${I[k]}<span><b>${v.name}</b><small>${v.sub}</small></span></button>`).join('')}</div>`;
  $$('#glass .tiles button').forEach(b=>b.onclick=()=>go(b.dataset.p));
  $('#scrim').classList.add('on'); $('#glass').classList.add('on');
}
function closeGlass(){ $('#glass').classList.remove('on'); if(!$('#sheet').classList.contains('on')) $('#scrim').classList.remove('on'); }

$$('#vt button').forEach(b=>b.onclick=()=>{
  if(b.dataset.view==='now' && ROOT && ROOT.ny && !ROOT.ny.now){ toast('No Now read yet. It shows up after the next run.'); return; }
  VIEW=b.dataset.view; render(); window.scrollTo({top:0});
  toast(VIEW==='now' ? 'Now: rest of the current session' : 'Pre-open: the 9:30 to 10:00 move');
});
$$('#sess button').forEach(b=>b.onclick=()=>{
  if(b.dataset.s==='overnight' && !(ROOT && ROOT.overnight)){ toast('No overnight read yet. It\'s built after 6 PM ET.'); return; }
  SESSION=b.dataset.s; render(); window.scrollTo({top:0});
});

function render(){
  shell();
  const D = readFor();
  if(!D && !['research','journal'].includes(PAGE)){ $('#app').innerHTML='<div class="empty">No read for this session yet. It arrives with the next run.</div>'; return; }
  $('#app').innerHTML = ({today:pageToday, levels:pageLevels, macro:pageMacro, record:pageRecord, research:pageResearch, journal:pageJournal}[PAGE])(D);
  if(PAGE==='journal') wireJournal();
  if(PAGE==='levels'){ const c=$('#copyLv'); if(c) c.onclick=copyLevels; }
}

/* ───────── TODAY ───────── */
function stampsHTML(D){
  const g=new Date(D.generated), asof=new Date(D.as_of), n=nextRun();
  const stale = SESSION==='ny' && VIEW!=='now' && D.date!==todayET();
  return `<div class="stamps">
    <div><span>Data up to</span>${tLocal(asof)}<em>${tET(asof)}, ${dayOf(D.date)}</em></div>
    <div><span>Built</span>${tLocal(g)}<em id="agoTxt">${ago(g)}</em></div>
    <div id="checkedRow"><span>Checked</span>${CHECKED?tLocal(CHECKED,true):'—'}<em id="chkAgo">${CHECKED?ago(CHECKED):''}</em></div>
    <div><span>Next update</span>${tLocal(n)}<em>can run a few min late</em></div>
    ${stale?'<div class="warn">This is the last session\'s read. Today\'s arrives with the morning run.</div>':''}
  </div>`;
}
function modeLine(D){
  if(SESSION==='overnight') return 'Built from 6 PM data. Graded at the 9:30 open.';
  if(VIEW==='now') return `Built from data up to ${tET(new Date(D.as_of))}. Graded when the session ends.`;
  return D.mode==='point-in-time' ? 'Built from data up to 9:25 ET, nothing later. Graded at 10:00.' : 'Market isn\'t open yet. Graded at 10:00.';
}
// first sentence of a signal's text: the data, not the commentary
function lead(t){
  t = String(t||'');
  const m = t.match(/^[\s\S]*?[.!?](?=\s+(?:[A-Z]|$))/);
  let out = m ? m[0] : t;
  if(/Latest:/.test(t)) out = t.replace(/\s+The news flow[^.]*\.\s*$/, '');
  return out;
}
function vbar(s){
  const L = Math.min(s.weight/1.5, 1)*50, c = s.score>0?'var(--up)':'var(--down)';
  if(!s.score || s.directional===false && !s.weight) return '<span class="vbar"></span>';
  return `<span class="vbar"><i style="${s.score>0?'left':'right'}:50%;width:${L}%;background:${c};box-shadow:0 0 10px ${c}"></i></span>`;
}
function tug(m){
  const sigs = m.signals.filter(s=>s.directional!==false && s.weight>0), T = sigs.reduce((a,s)=>a+s.weight,0)||1;
  const up = sigs.filter(s=>s.score>0).sort((a,b)=>b.weight-a.weight), dn = sigs.filter(s=>s.score<0).sort((a,b)=>b.weight-a.weight);
  const seg = (L,c) => L.map((s,i)=>`<i title="${esc(s.label)}" style="width:${(s.weight/T*100).toFixed(2)}%;background:${c};opacity:${Math.max(.45,1-i*.13).toFixed(2)};box-shadow:0 0 12px color-mix(in srgb,${c} 40%,transparent)"></i>`).join('');
  const w = L => L.reduce((a,s)=>a+s.weight,0).toFixed(1);
  const pos = 50 + Math.max(-1, Math.min(1, m.bias.score))*50;
  return `<div class="tug"><div class="track"><div class="side bear">${seg(dn,'var(--down)')}</div><div class="side bull">${seg(up,'var(--up)')}</div><i class="needle" style="left:${pos.toFixed(1)}%"></i></div>
    <div class="tl"><span>${dn.length} bearish, ${w(dn)}</span><span>${up.length} bullish, ${w(up)}</span></div></div>`;
}
function pageToday(D){
  const m = D.markets[SYM], b = m.bias;
  const stale = SESSION==='ny' && VIEW!=='now' && D.date!==todayET();
  const window_ = SESSION==='overnight' ? `Asia and London, ${dayOf(D.date)} 6 PM to 9:30 AM ET`
    : VIEW==='now' && D.window ? `${esc(D.window.name)} session, until ${tET(new Date(D.window.end))}` : `NY open, ${dayOf(D.date)}, 9:30 to 10:00 ET`;
  let h = `
  <div class="hero">
    <div class="kicker"><span class="live ${stale?'stale':''}" id="live"></span>${window_}</div>
    <div class="bias" style="--c:${C(b.bias)}">${b.bias}</div>
    <div class="conv"><span class="chip">${b.conviction} conviction</span><span class="chip" style="color:${C(b.bias)}">${b.score>0?'+':'−'}${Math.abs(b.score).toFixed(2)}</span></div>
    ${tug(m)}
    <p class="note">${esc(b.overall).replace(/(^|\. )(For:|Against:|On deck:)/g,'$1<b>$2</b>')}</p>
    ${b.invalidation?`<div class="flipv">Flips on ${esc(b.invalidation.charAt(0).toLowerCase()+b.invalidation.slice(1))}</div>`:''}
    <div class="mode">${modeLine(D)}</div>
    ${stampsHTML(D)}
  </div>`;
  const S = {};
  if(D.divergence) S.divergence = `<section><h2>NQ vs ES <span class="pill" style="color:var(--amber)">Split</span></h2>
      <div class="card pad" style="font-size:14.5px;line-height:1.55;color:var(--sub)">${esc(D.divergence)}</div></section>`;
  if(m.changed && VIEW!=='now'){ const c=m.changed, dir=c.delta>0.05?'More bullish':c.delta<-0.05?'More bearish':'About the same';
    S.changed = `<section><h2>Since last session <span class="pill" style="color:var(--dim)">${dir}</span></h2>
      <div class="card rows"><div class="r"><span>${dayOf(c.prev_date)}</span><span style="color:${C(c.prev_bias)}">${c.prev_bias} ${c.prev_score>0?'+':''}${c.prev_score.toFixed(2)}</span></div>
      <div class="r"><span>Change</span><span>${c.delta>0?'+':''}${c.delta.toFixed(2)}</span></div></div></section>`; }
  if(m.outcome && VIEW!=='now'){ const o=m.outcome, col=o.result==='hit'?'var(--up)':o.result==='miss'?'var(--down)':'var(--dim)';
    const a=SESSION==='overnight'?['6 PM','9:30 AM open']:['9:30 open','10:00'];
    S.outcome = `<section><h2>Result <span class="pill" style="color:${col}">${o.result==='hit'?'Right':o.result==='miss'?'Wrong':'Not graded'}</span></h2>
      <div class="card rows"><div class="r"><span>${a[0]}</span><span>${fmt(o.open)}</span></div><div class="r"><span>${a[1]}</span><span>${fmt(o.noon)}</span></div>
      <div class="r"><span>Move</span><span style="color:${o.move>=0?'var(--up)':'var(--down)'}">${o.move>0?'+':''}${fmt(o.move)} pts</span></div></div></section>`; }
  const groups={}; m.signals.forEach(s=>(groups[s.group]=groups[s.group]||[]).push(s));
  S.signals = `<section><h2>Votes</h2><div class="card">${Object.entries(groups).map(([gname,list])=>{
    const w=list.reduce((a,s)=>a+s.weight,0);
    const regime=list.every(s=>s.directional===false);
    return `<div class="grp"><span>${esc(gname)}</span><span>${regime?'context only':'weight '+w.toFixed(1)}</span></div>`+list.map(s=>{
      const tag=s.directional===false?'':`×${s.weight}${s.learned?`, tuned ×${s.learned}`:''}`;
      return `<div class="sig"><div class="sig-h"><h3>${esc(s.label)}<span class="w">${tag}</span></h3>${vbar(s)}</div>${P.reasons?`<p>${esc(lead(s.text))}</p>`:''}</div>`;}).join('');
  }).join('')}</div></section>`;
  S.calendar = `<section><h2>Releases, ${dayOf((D.events[0]||{}).date || (SESSION==='overnight'?nextWeekdayISO(D.date):D.date))}</h2><div class="card">${eventsHTML(D.events)}</div></section>`;
  if(m.earnings.length) S.earnings = `<section><h2>Mega-cap earnings</h2><div class="card rows">${m.earnings.map(e=>`<div class="r"><span>${esc(e.symbol)}</span><span>${esc(e.when)}</span></div>`).join('')}</div></section>`;
  if(D.sources && Object.keys(D.sources).length) S.freshness = `<section><h2>Data sources</h2><div class="card rows">${Object.entries(D.sources).map(([k,v])=>{
      const t = new Date(v.data_time||v.fetched);
      return `<div class="r"><span>${esc(k)}${v.detail?`<small>${esc(v.detail)}</small>`:''}</span>
        <span style="color:${v.ok?'var(--text)':'var(--down)'}">${v.ok?tLocal(t):'Failed'}<small>${v.ok?(v.data_time?'data as of ':'pulled ')+tET(t):'retries next run'}</small></span></div>`;}).join('')}</div></section>`;
  S.method = `<section class="foot">
    <p><b>Pre-open</b> calls 9:30 to 10:00 from 9:25 data. <b>Now</b> calls the rest of the live session (Asia 6 PM to 2 AM, London 2 to 9:30 AM, NY 9:30 AM to 4 PM) and updates hourly. <b>Overnight</b> calls 6 PM to the 9:30 open from 6 PM data.</p>
    <p>Each call is graded on its own window and tunes its own weights. Research explains every vote. Not financial advice.</p></section>`;
  for(const k of P.order) if(!P.hidden.includes(k) && S[k]) h += S[k];
  if(D.notes && D.notes.length) h += `<section><h2>Data notes</h2><div class="card pad err">${D.notes.map(esc).join('<br>')}</div></section>`;
  return h;
}
function nextWeekdayISO(iso){ const d=new Date(iso+'T12:00:00'); do{ d.setDate(d.getDate()+1); }while([0,6].includes(d.getDay())); return d.toISOString().slice(0,10); }
function eventsHTML(evs){

  const m=D.markets[SYM], L=m.levels||{}, R=m.expected_range, Dl=m.dealer, F=m.flow;
  let h = `<div class="ptitle">Levels</div><div class="psub">${esc(SYM)} prices as of ${tET(new Date(D.as_of))}, ${dayOf(D.date)}. From CBOE open interest, mapped to futures.</div>`;
  h += `<section><h2>Key levels</h2><div class="card rows">
      <div class="r"><span>Futures at cutoff</span><span>${fmt(L.price)}</span></div>
      ${L.call_wall?`<div class="r"><span>Call wall<small>resistance</small></span><span style="color:var(--up)">${fmt(L.call_wall,0)}</span></div>`:''}
      ${L.flip?`<div class="r"><span>Gamma flip<small>range above, trend below</small></span><span>${fmt(L.flip)}</span></div>`:''}
      ${L.flip_close?`<div class="r"><span>Flip at 4 PM</span><span>${fmt(L.flip_close)}</span></div>`:''}
      ${L.put_wall?`<div class="r"><span>Put wall<small>support</small></span><span style="color:var(--down)">${fmt(L.put_wall,0)}</span></div>`:''}
      ${R?`<div class="r"><span>Expected range (1σ)</span><span>${fmt(R.low,0)} – ${fmt(R.high,0)}<small>± ${fmt(R.move,0)} pts</small></span></div>`:''}
      ${(L.majors||[]).map(x=>`<div class="r"><span>Major ${x.net_gex>0?'+γ':'−γ'} level</span><span style="color:${x.net_gex>0?'var(--up)':'var(--down)'}">${fmt(x.level,0)}</span></div>`).join('')}
    </div>
    <div class="btnrow"><button class="btn" id="copyLv">Copy levels</button></div></section>`;
  if(!L.flip && !L.call_wall) h += `<section><div class="card pad" style="color:var(--dim);font-size:14px;line-height:1.5">No dealer levels for this read: the free feed didn't have that morning's open interest. Price and the volatility range are still shown.</div></section>`;
  if(m.profile && m.profile.length) h += `<section><h2>Dealer gamma profile</h2><div class="card pad">${profile(m.profile,L)}</div></section>`;
  if(Dl){ const lg=Dl.net_gex_bn>0;
    h += `<section><h2>Dealer positioning <span class="pill" style="color:${lg?'var(--up)':'var(--down)'}">${lg?'Long gamma':'Short gamma'}</span></h2><div class="card rows">
      <div class="r"><span>Net GEX (per 1% move)</span><span style="color:${lg?'var(--up)':'var(--down)'}">${usd(Dl.net_gex_bn)}B</span></div>
      <div class="r"><span>Call ÷ put gamma</span><span>${fmt(Dl.call_put_gamma)}</span></div>
      <div class="r"><span>Dealer option delta</span><span>${usd(Dl.dealer_delta_bn,1)}B</span></div>
      <div class="r"><span>Charm hedge flow to close</span><span style="color:${Dl.charm_bn>0?'var(--up)':'var(--down)'}">${Dl.charm_bn>0?'Buy':'Sell'} ${usd(Math.abs(Dl.charm_bn))}B</span></div>
      <div class="r"><span>Vanna per +1 vol pt</span><span>${usd(Dl.vanna_bn_per_pt)}B Δ</span></div>
      <div class="r"><span>Chains used</span><span>${Dl.chains.join(' + ')}</span></div></div></section>`; }
  if(F && (F.calls_m+F.puts_m)>0){ const cp=(F.calls_m/(F.calls_m+F.puts_m)*100).toFixed(1);
    h += `<section><h2>Options flow, prior session</h2><div class="card pad">
      <div class="flowbar"><div style="width:${cp}%;background:var(--up)"></div><div style="flex:1;background:var(--down)"></div></div>
      <div class="fl"><span style="color:var(--up)">Calls $${fmt(F.calls_m,1)}M</span><span style="color:var(--down)">Puts $${fmt(F.puts_m,1)}M</span></div>
      <div class="rows" style="margin:12px calc(-1*var(--pad)) calc(-1*var(--pad));border-top:1px solid var(--line)">
      ${F.top.map(t=>`<div class="r"><span>${fmt(t.level,0)} ${t.side}s</span><span style="color:${t.side==='call'?'var(--up)':'var(--down)'}">$${fmt(t.premium/1e6,1)}M</span></div>`).join('')}</div></div></section>`; }

function copyLevels(){
  const D=readFor(), m=D.markets[SYM], L=m.levels||{}, R=m.expected_range;
  const lines=[`${SYM} levels · ${D.date} · ${tET(new Date(D.as_of))} · ${m.bias.bias} (${m.bias.conviction})`];
  if(L.call_wall) lines.push(`Call wall ${fmt(L.call_wall,0)}`);
  if(L.flip) lines.push(`Gamma flip ${fmt(L.flip,2)}`);
  if(L.put_wall) lines.push(`Put wall ${fmt(L.put_wall,0)}`);
  (L.majors||[]).forEach(x=>lines.push(`Major ${x.net_gex>0?'+':'−'}γ ${fmt(x.level,0)}`));
  if(R) lines.push(`Range ${fmt(R.low,0)} – ${fmt(R.high,0)}`);
  const txt=lines.join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Levels copied'))
    .catch(()=>{ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); toast('Levels copied');}catch(e){} t.remove(); });
}
function profile(pts,L){
  const W=520,H=150,p=6, xs=pts.map(d=>d.px), ys=pts.map(d=>d.gex);
  const x0=Math.min(...xs),x1=Math.max(...xs),ym=Math.max(...ys.map(Math.abs))||1;
  const X=v=>p+(v-x0)/(x1-x0)*(W-2*p), Y=v=>H/2-v/ym*(H/2-14);
  const path=pts.map((d,i)=>(i?'L':'M')+X(d.px).toFixed(1)+','+Y(d.gex).toFixed(1)).join('');
  const area=path+`L${X(x1)},${H/2}L${X(x0)},${H/2}Z`;
  const vline=(v,c,t)=>v==null||v<x0||v>x1?'':`<line x1="${X(v)}" x2="${X(v)}" y1="10" y2="${H-4}" stroke="${c}" stroke-width="1.2" ${t==='now'?'':'stroke-dasharray="3 3"'}/><text x="${X(v)+3}" y="${t==='now'?H-8:12}" fill="${c}" font-size="10" font-family="-apple-system,system-ui,sans-serif">${t}</text>`;
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><clipPath id="cu"><rect width="${W}" height="${H/2}"/></clipPath><clipPath id="cd"><rect y="${H/2}" width="${W}" height="${H/2}"/></clipPath></defs>
    <path d="${area}" fill="var(--up)" opacity=".2" clip-path="url(#cu)"/><path d="${area}" fill="var(--down)" opacity=".2" clip-path="url(#cd)"/>
    <path d="${path}" fill="none" stroke="var(--text)" stroke-width="1.4" opacity=".8"/>
    <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line2)"/>${vline(L.flip,'var(--amber)','flip')}${vline(L.price,'var(--text)','now')}
  </svg><div class="meter-l" style="margin-top:6px"><span>${fmt(x0,0)}</span><span>long gamma above, short below</span><span>${fmt(x1,0)}</span></div>`;
}

function pageRecord(D){
  const sc=(D.markets[SYM]||{}).scorecard, sess=SESSION==='overnight'?'overnight calls, graded 6 PM to the 9:30 open':VIEW==='now'?'Now calls, each graded to its session close':'pre-open calls, graded 9:30 to 10:00';
  let h = `<div class="ptitle">Record</div><div class="psub">${esc(SYM)} ${sess}, on the futures move.</div>`;
  if(!sc || (!sc.hits && !sc.misses && !(sc.recent||[]).length))
    return h+`<section><div class="card pad" style="color:var(--dim);font-size:14px;line-height:1.55">Nothing graded yet. Calls are graded when their window ends. To fill this in faster, rebuild past dates in GitHub: Actions, Morning bias report, Run workflow, then enter a date.</div></section>`;
  const pc = v => v==null?'—':v+'%';
  const st = sc.streak||{};
  h += `<section class="big"><div><span>Hit rate</span><b style="color:${(sc.pct??0)>=50?'var(--up)':'var(--down)'}">${pc(sc.pct)}</b><small>${sc.hits} right, ${sc.misses} wrong</small></div>
        <div><span>Streak</span><b style="color:${st.kind==='hit'?'var(--up)':'var(--down)'}">${st.n||0}</b><small>${st.kind==='hit'?'in a row right':st.kind==='miss'?'in a row wrong':'—'}</small></div></section>`;
  const barRow=(label,r)=>`<div class="r" style="display:block"><div style="display:flex;justify-content:space-between"><span style="color:var(--dim)">${label}</span><span style="font-family:var(--mono);font-weight:600">${pc(r.pct)} <small style="display:inline">${r.hits}–${r.misses}</small></span></div>
     <div class="bar"><i style="width:${r.pct??0}%;background:${(r.pct??0)>=50?'var(--up)':'var(--down)'}"></i></div></div>`;
  h += `<section><h2>By call</h2><div class="card rows">${barRow('Bullish calls',sc.by_bias.Bullish)}${barRow('Bearish calls',sc.by_bias.Bearish)}</div></section>`;
  h += `<section><h2>By conviction</h2><div class="card rows">${['High','Medium','Low','Very low'].filter(c=>sc.by_conviction[c]).map(c=>barRow(c+' conviction',sc.by_conviction[c])).join('')}</div></section>`;
  const recent=sc.recent||[];
  h += `<section><h2>Last ${recent.length} sessions</h2><div class="card"><div class="dots">${recent.map(r=>`<span title="${r.date}" style="background:${r.result==='hit'?'var(--up)':r.result==='miss'?'var(--down)':'var(--line2)'}">${r.bias[0]}</span>`).join('')}</div>
    <div class="psub" style="padding:0 var(--pad) var(--pad);font-size:12px">Green was right, red was wrong, grey wasn't graded. The letter is the call.</div></div></section>`;
  if((sc.signals||[]).length) h += `<section><h2>Which signals worked</h2><div class="card rows">${sc.signals.map(s=>
    `<div class="r" style="display:block"><div style="display:flex;justify-content:space-between"><span style="color:var(--dim)">${esc(s.label)}</span><span style="font-family:var(--mono);font-weight:600">${s.pct}% <small style="display:inline">${s.right}/${s.n}</small></span></div>
     <div class="bar"><i style="width:${s.pct}%;background:${s.pct>=55?'var(--up)':s.pct<=45?'var(--down)':'var(--flat)'}"></i></div></div>`).join('')}</div>
     <div class="psub" style="margin-top:8px;font-size:12px">How often each vote pointed the way price went. Over 55% earns its weight, under 45% is worse than a coin flip. Give it a few weeks before trusting it.</div></section>`;
  h += `<section><h2>History</h2><div class="card rows">${recent.slice().reverse().map(r=>`<div class="r"><span>${dayOf(r.date)}<small>${r.conviction} conviction</small></span>
    <span style="color:${r.result==='hit'?'var(--up)':r.result==='miss'?'var(--down)':'var(--dim)'}">${r.bias}, ${r.move>0?'+':''}${fmt(r.move,0)}<small>${r.result==='hit'?'right':r.result==='miss'?'wrong':'not counted'}</small></span></div>`).join('')}</div></section>`;
  return h;
}

 ['News','news','Headline tone','Risk-on vs risk-off headlines from CNBC, MarketWatch, Yahoo Finance and Investing.com in the 16 hours before the cutoff, scored with a finance word list.','The flow of news shapes how traders lean into the session, and a lopsided tape of headlines tends to show up in price.','Tetlock (JF 2007); Loughran & McDonald (JF 2011).','Headlines often describe moves that already happened, and one big story can outweigh twenty small ones.'],
 ['Session','sessdrift','Session so far','The futures move since the current session (Asia, London or NY) opened. Used by the Now call.','Order flow that builds early in a session tends to keep going: institutions work big orders over hours, and early moves pull in trend followers.','Gao, Han, Li & Zhou, Market Intraday Momentum (JFE 2018).','A news shock or a scheduled release mid-session resets it.'],
 ['Session','lasthr','Last hour','The futures move over the past 60 minutes. Used by the Now call.','The most recent flow is the freshest read on who is in control.','Short-horizon order-flow persistence; Heston, Korajczyk & Sadka (JF 2010).','Lunchtime chop and pre-release positioning make it noisy.'],
 ['Session','orange','Opening range','Where NY price sits versus the 9:30–10:00 high and low. Used by the Now call after 10:00.','A break of the opening range shows one side won the open auction, and those moves tend to extend.','Crabel, Day Trading with Short Term Price Patterns and Opening Range Breakout (1990); Zarattini & Aziz (2023).','Inside-range days, and false breaks on light volume.'],
 ['Dealer positioning','vanna','Vanna','The dealer delta change caused by the pre-market move in implied vol.','When implied vol falls, the deltas of out-of-the-money options shrink, and dealers buy back hedges.','Practitioner research. See SqueezeMetrics (2017).','The vol input is estimated from VXX, so it\'s rough.'],

function pageResearch(D){
  const live = D ? Object.fromEntries((D.markets[SYM]||{signals:[]}).signals.map(s=>[s.key,s])) : {};
  let h = `<div class="ptitle">Research</div><div class="psub">Every vote: what it measures, why it works, the evidence, and when it fails. The badge shows how it's voting in the current ${esc(SYM)} read.</div>`;
  const groups={}; RS.forEach(r=>(groups[r[0]]=groups[r[0]]||[]).push(r));
  for(const [g,list] of Object.entries(groups)){
    h += `<section><h2>${g}</h2><div class="card">${list.map(([_,key,name,what,why,paper,fails])=>{
      const s=live[key], c=!s?'var(--line2)':s.score>0?'var(--up)':s.score<0?'var(--down)':'var(--faint)';
      return `<details class="rs"><summary><div class="ico" style="color:${c};border-color:${c}">${!s?'·':s.score>0?'+':s.score<0?'−':'0'}</div><h3>${name}${s?`<span class="w">${s.directional===false?'regime':'×'+s.weight}</span>`:''}</h3><em>›</em></summary>
        <div class="rsb"><p><b>Measures:</b> ${what}</p><p><b>Why it works:</b> ${why}</p><p><b>Fails when:</b> ${fails}</p><p class="paper">${paper}</p>${s?`<p><b>Right now:</b> ${esc(s.text)}</p>`:''}</div></details>`;}).join('')}</div></section>`;
  }
  h += `<section><h2>How it works</h2><div class="card pad foot" style="font-size:13.5px;color:var(--sub)">
    <p><b>Point-in-time.</b> Each read uses only data from before its cutoff: 9:25 AM ET for NY, 6 PM ET for overnight. So the record is a fair test, not hindsight.</p>
    <p><b>Scoring.</b> Signals score +1, 0 or −1 times their weight, and the total is scaled to −1…+1. Every call picks a side: above zero reads Bullish, below zero Bearish. Conviction shows how strong the lean is: Very low under 0.08 (close to a coin flip), Low under 0.30, Medium 0.30–0.50, High above 0.50. NQ and ES are blended 65/35 with each other.</p>
    <p><b>Event days.</b> With a high-impact release later the same day (FOMC, CPI, jobs) the score is multiplied by 0.6 and conviction is capped at Low. Mega-cap earnings that night or last night multiply it by 0.85.</p>
    <p><b>Dealer positioning.</b> Gamma flip, walls, charm and vanna vote alongside macro at lighter weights, and also set the regime (range vs trend) and the levels.</p>
    <p><b>Self-tuning.</b> Once a signal has 20 graded sessions, its weight is scaled by its own hit rate (0.25× to 1.5×, shrunk toward 50% so streaks don't fool it), using only sessions before the one being read.</p>
    <p><b>Use it right.</b> Check Record. Weights retune themselves after 20 graded sessions. Under 45% after a month means that signal is fighting you.</p></div></section>`;
  return h;
}

function wireJournal(){
  $$('#jAct button').forEach(b=>b.onclick=()=>{ JF.action=b.dataset.a; JF.result=$('#jRes').value; render(); });
  $('#jSave').onclick=()=>{
    const D=readFor(), m=D&&D.markets[SYM];
    J.push({id:Date.now(), date:(D&&D.date)||todayET(), sym:SYM, session:SESSION, bias:m?m.bias.bias:'', conviction:m?m.bias.conviction:'',
      action:JF.action, result:$('#jRes').value.trim(), note:$('#jNote').value.trim()});
    store.set('journal', J); JF={action:'with', result:''}; toast('Saved to journal'); render();
  };
  $$('.jrow .del').forEach(b=>b.onclick=()=>{ if(confirm('Delete this entry?')){ J=J.filter(e=>String(e.id)!==b.dataset.id); store.set('journal',J); render(); } });
  $('#jExp').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(J,null,1)],{type:'application/json'}));
    a.download='bias-journal-'+todayET()+'.json'; a.click(); };
  $('#jImp').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const x=JSON.parse(t);
    if(Array.isArray(x)){ const ids=new Set(J.map(e=>e.id)); J=J.concat(x.filter(e=>!ids.has(e.id))); store.set('journal',J); toast('Imported '+x.length+' entries'); render(); } }catch(err){ toast('That file is not a journal export'); } }); };
}

        x += Math.cos(a)*seg; y += Math.sin(a)*seg; }
      const Lf=[], Rt=[];
      for(let i=0;i<=N;i++){ const p=C[i], q=C[Math.min(N,i+1)], o=C[Math.max(0,i-1)];
        const dx=q[0]-o[0], dy=q[1]-o[1], m=Math.hypot(dx,dy)||1, nx=-dy/m, ny=dx/m;
        Lf.push([p[0]+nx*Wd[i], p[1]+ny*Wd[i]]); Rt.push([p[0]-nx*Wd[i], p[1]-ny*Wd[i], nx, ny]); }
      cx.fillStyle='#030304'; cx.beginPath(); cx.moveTo(Lf[0][0],Lf[0][1]);
      for(const p of Lf) cx.lineTo(p[0],p[1]); for(let i=N;i>=0;i--) cx.lineTo(Rt[i][0],Rt[i][1]); cx.closePath(); cx.fill();
      // wet highlight running along one side
      const hc = mix([255,255,255], this.c, .25);
      cx.lineCap='round';
      for(let i=1;i<N-1;i++){ const p=C[i], q=C[i+1], k=.45;
        cx.strokeStyle=css(hc, (1-i/N)*.75*S.glow); cx.lineWidth=Math.max(.6, Wd[i]*.18);
        cx.beginPath(); cx.moveTo(p[0]+(Lf[i][0]-p[0])*k, p[1]+(Lf[i][1]-p[1])*k); cx.lineTo(q[0]+(Lf[i+1][0]-q[0])*k, q[1]+(Lf[i+1][1]-q[1])*k); cx.stroke(); } },
    frame(dt,t){
      const c=this.c, T=t*S.speed, g=cx.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.75);
      g.addColorStop(0, css(mix([46,46,54],c,.18))); g.addColorStop(.6, css(mix([20,20,24],c,.08))); g.addColorStop(1,'#050506');
      cx.fillStyle=g; cx.fillRect(0,0,W,H);
      const v=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.72);   // goo pooled at the edges
      v.addColorStop(0,'rgba(3,3,4,0)'); v.addColorStop(1,'rgba(3,3,4,.92)'); cx.fillStyle=v; cx.fillRect(0,0,W,H);
      for(const d of this.t) this.tendril(d,T); }
  },
  blackhole:{
    // Sky (stars + a dusty galaxy band) is painted once to an offscreen canvas; only the disk moves.
    init(){ const c=rgb(tint()); this.c=c;
      const sky=off(Math.ceil(W*DPR),Math.ceil(H*DPR)), g=sky.getContext('2d'); g.scale(DPR,DPR);
      g.fillStyle='#020205'; g.fillRect(0,0,W,H);
      g.save(); g.translate(W*.5,H*.42); g.rotate(-.55);                          // galaxy band: many faint dust puffs
      for(let i=0;i<260;i++){ const x=(R()-.5)*W*1.8, y=(R()+R()+R()-1.5)*H*.12, r=20+R()*70;
        const warm = R()<.5, col = warm?[150,120,110]:[110,120,160], gr=g.createRadialGradient(x,y,0,x,y,r);
        gr.addColorStop(0,css(col,.035)); gr.addColorStop(1,css(col,0)); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); }
      for(let i=0;i<70;i++){ const x=(R()-.5)*W*1.6, y=(R()-.5)*H*.08, r=8+R()*26, gr=g.createRadialGradient(x,y,0,x,y,r);  // dark dust lanes
        gr.addColorStop(0,'rgba(0,0,0,.35)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); }
      g.restore();
      for(let i=0;i<n(260);i++){ const x=R()*W, y=R()*H, m=R()**3, r=.35+m*1.3, t=R();
        g.fillStyle = css(t<.2?[255,214,180]:t<.4?[190,210,255]:[235,235,245], .25+.75*m); g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
      this.sky=sky; this.tw=Array.from({length:n(30)},()=>({x:R()*W,y:R()*H,ph:R()*TAU,f:.4+R()*1.2}));
      sprites={d:glowSprite([255,240,225],6)};
      this.cxh=W*.58; this.cyh=H*.72; this.rs=Math.min(W,H)*.1*S.size;
      this.p = Array.from({length:Math.round(1500*S.amount)},()=>{ const r=this.rs*(2.3+Math.pow(R(),1.6)*4.2); return {r, a:R()*TAU, h:(R()-.5)*this.rs*.12, b:.4+R()*.6}; }); },
    temp(f){ // f: 0 inner hot → 1 outer cool; blended toward the chosen tint
      const hot=[255,246,232], mid=[255,170,92], cool=[170,52,30], base = f<.35 ? mix(hot,mid,f/.35) : mix(mid,cool,(f-.35)/.65);
      return mix(base, this.c, S.tint==='style'?0:.55); },
    frame(dt,t){
      cx.drawImage(this.sky,0,0,W,H);
      cx.globalCompositeOperation='lighter';
      for(const s of this.tw){ cx.globalAlpha=(.2+.8*Math.sin(t*s.f+s.ph)**2)*.7; cx.drawImage(sprites.d,s.x-3,s.y-3,6,6); }
      const X=this.cxh, Y=this.cyh, rs=this.rs, tilt=.2, rin=rs*2.3, rout=rs*6.5;
      // soft glow of the whole disk
      const halo=cx.createRadialGradient(X,Y,rs,X,Y,rout*1.25); halo.addColorStop(0,css(this.temp(.3),.16*S.glow)); halo.addColorStop(1,css(this.temp(.8),0));
      cx.globalAlpha=1; cx.fillStyle=halo; cx.fillRect(X-rout*1.3,Y-rout*1.3,rout*2.6,rout*2.6);
      const pass = front => {
        for(const p of this.p){
          if(!front) p.a += dt*S.speed*1.6*Math.pow(rin/p.r,1.5);
          const sa=Math.sin(p.a), ca=Math.cos(p.a); if((sa>0)!==front) continue;
          const f=(p.r-rin)/(rout-rin), dop=1+.75*ca;                     // left side (cos>0 after flip) comes toward us: brighter
          const x=X-ca*p.r, y=Y+sa*p.r*tilt+p.h, len=Math.min(.35, 6/p.r*(1+S.speed));
          cx.strokeStyle=css(this.temp(f), Math.min(1,(.12+.42*(1-f))*p.b*dop*S.glow)); cx.lineWidth=(1.5-.8*f)*Math.max(.6,S.size*.8);
          cx.beginPath(); cx.ellipse(X,Y+p.h,p.r,p.r*tilt,0,p.a-len,p.a); cx.stroke();
          if(!front && f<.7){                       // the same far-side gas, lensed into a bow over the shadow
            const rr=rs*1.32+f*rs*1.15, rx=rr*1.16, phi=TAU-Math.acos(Math.max(-1,Math.min(1,-ca)));
            cx.strokeStyle=css(this.temp(f*.9), Math.min(1,(.07+.3*(1-f))*p.b*dop*S.glow)); cx.lineWidth=1-.4*f;
            cx.beginPath(); cx.ellipse(X,Y,rx,rr,0,phi-len*.8,phi); cx.stroke();
            if(f<.35){ cx.strokeStyle=css(this.temp(f), .05*p.b*S.glow);     // faint second image under the hole
              cx.beginPath(); cx.ellipse(X,Y,rx*.92,rr*.8,0,TAU-phi-len*.6,TAU-phi); cx.stroke(); } }
        } };
      pass(false);
      cx.globalCompositeOperation='source-over'; cx.globalAlpha=1;
      const sh=cx.createRadialGradient(X,Y,rs*.9,X,Y,rs*1.25); sh.addColorStop(0,'#000'); sh.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=sh; cx.beginPath(); cx.arc(X,Y,rs*1.25,0,TAU); cx.fill();
      cx.globalCompositeOperation='lighter';
      cx.strokeStyle=css(this.temp(.05),.07*S.glow); cx.lineWidth=5; cx.beginPath(); cx.arc(X,Y,rs*1.05,0,TAU); cx.stroke();   // photon ring: soft glow
      cx.strokeStyle=css(this.temp(0),.32*S.glow); cx.lineWidth=.9; cx.beginPath(); cx.arc(X,Y,rs*1.03,0,TAU); cx.stroke();
      pass(true);
      cx.globalCompositeOperation='source-over'; cx.globalAlpha=1; }
  },
  aurora:{
    init(){ const c=rgb(tint()); this.c=[c, mix(c,[120,120,255],.55), mix(c,[255,120,200],.4)]; },
    frame(dt,t){
      cx.fillStyle='#02040a'; cx.fillRect(0,0,W,H); cx.globalCompositeOperation='lighter';
      const T = t*.18*S.speed, step = 4;
      this.c.forEach((c,k)=>{ const base = H*(.22+k*.17), amp = 34*S.size;
        for(let x=0;x<W;x+=step){
          const y = base + Math.sin(x*.012+T*(1+k*.3)+k)*amp + Math.sin(x*.031-T*1.7+k*2)*amp*.45;
          const h = (130+80*Math.sin(x*.02+T*2+k))*S.size*(.6+.4*S.amount);
          const a = (.22+.14*Math.sin(x*.05+T*3+k))*S.glow;
          const gr = cx.createLinearGradient(0,y-h,0,y); gr.addColorStop(0,css(c,0)); gr.addColorStop(.8,css(c,a)); gr.addColorStop(1,css(c,0));
          cx.fillStyle=gr; cx.fillRect(x,y-h,step,h); } });
      cx.globalCompositeOperation='source-over'; }
  },
  stars:{
    init(){ const c=rgb(tint()); this.c=c; sprites={d:glowSprite(c,8), s:starSprite(c)};
      this.s = Array.from({length:n(160)},()=>({x:R()*W,y:R()*H,z:R(),ph:R()*TAU,f:.5+R()*2}));
      this.sh = null; this.next = 1+R()*3; },
    frame(dt,t){
      const g=cx.createRadialGradient(W*.5,H*1.1,0,W*.5,H*.6,H*1.1); g.addColorStop(0,css(mix([12,14,30],this.c,.12))); g.addColorStop(1,'#010207');
      cx.fillStyle=g; cx.fillRect(0,0,W,H); cx.globalCompositeOperation='lighter';
      for(const s of this.s){ s.y += (2+6*s.z)*dt*S.speed; if(s.y>H+4){s.y=-4;s.x=R()*W;}
        cx.globalAlpha = (.25+.75*Math.sin(t*s.f+s.ph)**2)*(.3+.7*s.z)*S.glow; const r=(1+2.6*s.z)*S.size; cx.drawImage(sprites.d,s.x-r,s.y-r,r*2,r*2); }
      this.next -= dt*S.speed*S.amount;
      if(!this.sh && this.next<0){ this.sh={x:R()*W*.8+W*.2,y:R()*H*.4,vx:-(260+R()*160),vy:120+R()*80,life:0}; this.next=2+R()*5; }
      if(this.sh){ const s=this.sh; s.life+=dt*S.speed; s.x+=s.vx*dt*S.speed; s.y+=s.vy*dt*S.speed;
        const a=Math.max(0,1-s.life/1.1)*S.glow; const gr=cx.createLinearGradient(s.x,s.y,s.x-s.vx*.25,s.y-s.vy*.25);
        gr.addColorStop(0,css(mix(this.c,[255,255,255],.7),a)); gr.addColorStop(1,css(this.c,0));
        cx.strokeStyle=gr; cx.lineWidth=2*S.size; cx.lineCap='round'; cx.beginPath(); cx.moveTo(s.x,s.y); cx.lineTo(s.x-s.vx*.25,s.y-s.vy*.25); cx.stroke();
        cx.globalAlpha=a; cx.drawImage(sprites.s,s.x-12,s.y-12,24,24); if(s.life>1.1) this.sh=null; }
      cx.globalAlpha=1; cx.globalCompositeOperation='source-over'; }
  },
  off:{ init(){}, frame(){ const g=cx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#0b0d16'); g.addColorStop(1,'#05060b'); cx.fillStyle=g; cx.fillRect(0,0,W,H); } }
};

  let raf = 0, last = 0, t = 0, running = false, built = '';
  function size(){ DPR = Math.min(window.devicePixelRatio||1, 2); W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); cx.setTransform(DPR,0,0,DPR,0,0); }
  function build(){ size(); scene = SCENES[S.style]; scene.init(); built = [S.style, tint(), S.amount, S.size, W, H].join('|'); }
  function loop(now){
    const dt = Math.min(.05, (now-last)/1000) * (reduce ? .25 : 1); last = now; t += dt;
    scene.frame(dt, t); raf = requestAnimationFrame(loop);
  }
  function start(){ if(running || document.hidden) return; running = true; last = performance.now(); raf = requestAnimationFrame(loop); }
  function stop(){ running = false; cancelAnimationFrame(raf); }
  function config(p, call){
    Object.assign(S, {style:p.fx||'off', tint:p.fxTint||'style', speed:+p.fxSpeed||1, amount:+p.fxAmount||1, size:+p.fxSize||1, glow:+p.fxGlow||1, call:call||'Bearish'});
    if(S.style==='off' || !SCENES[S.style]){ stop(); cv.hidden = true; return; }
    cv.hidden = false;
    if([S.style, tint(), S.amount, S.size, window.innerWidth, window.innerHeight].join('|') !== built) build();
    start();
  }
  document.addEventListener('visibilitychange', () => { if(document.hidden) stop(); else if(S.style!=='off') start(); });
  let rt = 0; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if(S.style!=='off') build(); }, 200); });
  return { config };
})();

/* ───────── settings sheet ───────── */
function seg(key, opts, label){
  return `<div class="st"><h4>${label}</h4><div class="seg">${Object.entries(opts).map(([v,t])=>
    `<button data-k="${key}" data-v="${v}" class="${String(P[key])===v?'on':''}">${t}</button>`).join('')}</div></div>`;
}
function openSettings(){
  closeGlass();
  const t = THEMES[P.theme]||THEMES.classic;
  $('#sheetIn').innerHTML = `
    <div class="sh-top"><h3>Settings</h3><button class="hbtn" id="done">Done</button></div>
    <div class="st"><h4>Colors</h4><div class="seg">${Object.entries(THEMES).map(([k,v])=>
      `<button data-k="theme" data-v="${k}" class="${P.theme===k&&!P.up&&!P.down?'on':''}"><span class="sw"><i style="background:${v.up}"></i><i style="background:${v.down}"></i></span>${v.name}</button>`).join('')}</div>
      <div class="colors"><label>Bullish <input type="color" id="cUp" value="${P.up||t.up}"></label><label>Bearish <input type="color" id="cDown" value="${P.down||t.down}"></label></div></div>
    ${seg('fx', FX_STYLES, 'Animated background')}
    ${P.fx!=='off' ? `<div class="st"><h4>Animation color</h4><div class="seg">${Object.entries(FX_TINTS).map(([v,t])=>
      `<button data-k="fxTint" data-v="${v}" class="${P.fxTint===v?'on':''}">${v.startsWith('#')?`<span class="sw"><i style="background:${v}"></i></span>`:''}${t}</button>`).join('')}</div></div>
    <div class="st rng">${[['fxSpeed','Speed',.1,2.5],['fxAmount','Amount',.2,2.5],['fxSize','Size',.5,2],['fxGlow','Brightness',.2,1.8]].map(([k,l,mn,mx])=>
      `<label for="r-${k}"><span>${l}</span><output id="o-${k}">${Math.round(P[k]*100)}%</output></label><input type="range" id="r-${k}" data-r="${k}" min="${mn}" max="${mx}" step="0.05" value="${P[k]}">`).join('')}</div>` : ''}
    ${seg('bg', Object.fromEntries(Object.entries(BGS).map(([k,v])=>[k,v.name])), P.fx!=='off' ? 'Background (when animation is off)' : 'Background')}
    ${seg('size', {s:'Small', m:'Medium', l:'Large'}, 'Text size')}
    ${seg('density', {comfortable:'Comfortable', compact:'Compact'}, 'Layout')}
    ${seg('reasons', {true:'Show data', false:'Bars only'}, 'Vote detail')}
    ${seg('market', {NQ:'NQ', ES:'ES'}, 'Open on')}
    <div class="st"><h4>Today page sections</h4><div class="card">${P.order.map((k,i)=>`
      <div class="secrow"><span>${SECTIONS[k]}</span>
        <button class="mv" data-mv="${i}" data-d="-1" ${i===0?'disabled style="opacity:.3"':''}>↑</button>
        <button class="mv" data-mv="${i}" data-d="1" ${i===P.order.length-1?'disabled style="opacity:.3"':''}>↓</button>
        <button class="tg ${P.hidden.includes(k)?'':'on'}" data-tg="${k}" aria-label="Show ${SECTIONS[k]}"></button></div>`).join('')}</div></div>
    <button class="reset" id="reset">Reset to defaults</button>`;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSettings(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
function changed(){ save(); applyPrefs(); if(ROOT) render(); const y=$('#sheet').scrollTop; openSettings(); $('#sheet').scrollTop=y; }
$('#sheet').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='done') return closeSettings();
  if(b.id==='reset'){ P={...DEFAULTS, order:[...DEFAULTS.order], hidden:[]}; SYM=P.market; return changed(); }
  if(b.dataset.k){ let v=b.dataset.v; if(v==='true'||v==='false') v=(v==='true');
    P[b.dataset.k]=v; if(b.dataset.k==='theme'){P.up=null;P.down=null;} if(b.dataset.k==='market') SYM=v; return changed(); }
  if(b.dataset.mv){ const i=+b.dataset.mv, j=i+(+b.dataset.d); [P.order[i],P.order[j]]=[P.order[j],P.order[i]]; return changed(); }
  if(b.dataset.tg){ const k=b.dataset.tg; P.hidden = P.hidden.includes(k) ? P.hidden.filter(x=>x!==k) : [...P.hidden,k]; return changed(); }
});
$('#sheet').addEventListener('input', e=>{
  const k = e.target.dataset && e.target.dataset.r;
  if(k){ P[k] = +e.target.value; const o=$('#o-'+k); if(o) o.textContent = Math.round(P[k]*100)+'%'; save(); try{ FX.config(P, CALL); }catch(err){} return; }
  if(e.target.id==='cUp'){ P.up=e.target.value; save(); applyPrefs(); if(ROOT) render(); }
  if(e.target.id==='cDown'){ P.down=e.target.value; save(); applyPrefs(); if(ROOT) render(); }
});
$('#gear').onclick = openSettings;
$('#scrim').onclick = () => { closeGlass(); closeSettings(); };
$('#refresh').onclick = () => load(true);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
applyPrefs(); shell(); load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
