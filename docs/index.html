<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-Market Bias</title>
<meta name="theme-color" content="#07090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bias">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#07090b; --card:#0e1215; --line:#1b2126; --text:#e8edf0; --dim:#8a959d; --faint:#55606a;
  --up:#3ee6a4; --down:#ff5a6e; --flat:#9aa4ac; --amber:#f2b84b;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 28px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:14px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.brand b{color:var(--text);font-weight:600}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:8px;box-shadow:0 0 10px var(--up)}
.live.stale{background:var(--amber);box-shadow:0 0 10px var(--amber)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.refresh{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{flex:1;font-family:var(--mono);font-size:13px;padding:9px 0;border:1px solid var(--line);border-radius:10px;color:var(--dim)}
.tab.on{color:var(--text);border-color:#2c353c;background:var(--card)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:7px;vertical-align:middle}

.hero{padding:18px 0 6px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.bias{display:flex;align-items:center;gap:12px;margin:10px 0 2px;font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bias svg{width:38px;height:38px;flex:none}
.conv{font-size:17px;font-weight:600;margin-top:10px}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.6}
.meter{position:relative;height:6px;border-radius:6px;margin:18px 0 8px;
  background:linear-gradient(90deg,var(--down),#3a2b30 42%,#28303a 50%,#24382f 58%,var(--up))}
.meter i{position:absolute;top:-5px;width:3px;height:16px;border-radius:2px;background:var(--text);transform:translateX(-50%);box-shadow:0 0 0 3px var(--bg)}
.meter-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--faint)}

section{margin-top:18px}
h2{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pad{padding:16px}
.idea{font-size:16.5px;line-height:1.55}
.inval{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--dim);line-height:1.5}
.inval b{color:var(--text);font-weight:600}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:none;border:1px solid currentColor;border-radius:999px;padding:3px 9px}

.sig{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.sig:first-child{border-top:0}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:12px 16px 4px;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.ico{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;margin-top:1px}
.sig h3{font-size:15px;font-weight:650;margin-bottom:4px}
.sig p{font-size:14px;line-height:1.5;color:#b4bec5}
.w{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:6px;font-weight:400}

.rows .r{display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-top:1px solid var(--line);font-size:14.5px}
.rows .r:first-child{border-top:0}
.rows .r span:first-child{color:var(--dim)}
.rows .r span:last-child{font-family:var(--mono);font-weight:600}

.flowbar{display:flex;height:8px;border-radius:8px;overflow:hidden;margin:4px 0 8px}
.flowbar div:first-child{background:var(--up)}
.flowbar div:last-child{background:var(--down)}
.fl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;font-weight:600}

svg.prof{display:block;width:100%;height:150px}
.ev{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--mono);color:var(--dim);width:72px;flex:none}
.ev small{display:block;color:var(--faint);font-family:var(--mono);font-size:11px;margin-top:3px}
.imp{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
.sc{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px}
.sc span{font-family:var(--mono);font-size:11px;padding:5px 8px;border-radius:7px;border:1px solid var(--line)}
.foot{font-size:12.5px;line-height:1.6;color:var(--faint);margin-top:22px}
.foot p{margin-bottom:10px}
.foot b{color:var(--dim);font-weight:600}
.err{color:var(--amber);font-family:var(--mono);font-size:12px;line-height:1.6}
.empty{padding:60px 0;text-align:center;color:var(--dim);font-size:15px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="brand"><span class="live" id="live"></span><b>NY AM</b> · Pre-Market Bias</div>
      <button class="refresh" id="refresh">↻ Refresh</button>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="app"><div class="empty">Loading this morning's read…</div></main>
</div>

<script>
const $ = s => document.querySelector(s);
const C = {Bullish:'var(--up)', Bearish:'var(--down)', Neutral:'var(--flat)'};
const fmt = (n,d=2) => n==null||isNaN(n) ? '—' : Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = (n,d=2) => n==null||isNaN(n) ? '—' : (n<0?'−':'')+'$'+fmt(Math.abs(n),d);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null, SYM=null;
try{ SYM = localStorage.getItem('sym'); }catch(e){}

const arrow = b => b==='Bullish'
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 18L18 6M9 6h9v9"/></svg>'
  : b==='Bearish'
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 9v9H9"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 12h16M15 7l5 5-5 5"/></svg>';

async function load(){
  $('#refresh').textContent='↻ …';
  try{
    const r = await fetch('data/latest.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
  }catch(e){
    if(!DATA){ $('#app').innerHTML = '<div class="empty">No report yet.<br>The first one appears after the morning run.</div>'; }
  }
  $('#refresh').textContent='↻ Refresh';
  if(DATA) render();
}

function render(){
  const syms = Object.keys(DATA.markets);
  if(!syms.includes(SYM)) SYM = syms[0];
  $('#tabs').innerHTML = syms.map(s=>{
    const b = DATA.markets[s].bias.bias;
    return `<button class="tab ${s===SYM?'on':''}" data-s="${s}">${s}<span class="dot" style="background:${C[b]}"></span></button>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{SYM=t.dataset.s;try{localStorage.setItem('sym',SYM)}catch(e){};render();window.scrollTo({top:0})});

  const today = new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
  $('#live').classList.toggle('stale', DATA.date!==today);

  const m = DATA.markets[SYM], b = m.bias, col = C[b.bias];
  const pos = ((b.score+1)/2*100).toFixed(1);
  const L = m.levels, D = m.dealer, F = m.flow, R = m.expected_range;

  let h = `
  <div class="hero">
    <div class="kicker">${esc(SYM)} · New York AM outlook</div>
    <div class="bias" style="color:${col}">${arrow(b.bias)}${b.bias}</div>
    <div class="conv">${b.conviction} conviction</div>
    <div class="meta">Prepared ${esc(DATA.generated_label)}${DATA.date!==today?'<br><span style="color:var(--amber)">This is not today\'s report. The next run is pending.</span>':''}</div>
    <div class="meter"><i style="left:${pos}%"></i></div>
    <div class="meter-l"><span>Bearish</span><span>Score ${b.score>0?'+':''}${b.score.toFixed(2)} · ${b.ups}↑ ${b.downs}↓ of ${b.total}</span><span>Bullish</span></div>
  </div>

  <section><h2>Overall idea</h2>
    <div class="card pad"><p class="idea">${esc(b.overall)}</p>
    ${b.invalidation?`<div class="inval"><b>What flips the view:</b> ${esc(b.invalidation)}.</div>`:''}</div>
  </section>`;

  if(m.changed){
    const c=m.changed, dir=c.delta>0.05?'Leaning more bullish':c.delta<-0.05?'Leaning more bearish':'Little changed';
    h += `<section><h2>What changed <span class="pill" style="color:var(--dim)">${dir}</span></h2>
      <div class="card rows"><div class="r"><span>Prior read (${esc(c.prev_date)})</span><span style="color:${C[c.prev_bias]}">${c.prev_bias} ${c.prev_score>0?'+':''}${c.prev_score.toFixed(2)}</span></div>
      <div class="r"><span>Score change</span><span>${c.delta>0?'+':''}${c.delta.toFixed(2)}</span></div></div></section>`;
  }

  // signals grouped
  const groups = {};
  m.signals.forEach(s=>(groups[s.group]=groups[s.group]||[]).push(s));
  h += `<section><h2>Signals</h2><div class="card">`;
  for(const [g,list] of Object.entries(groups)){
    h += `<div class="grp">${esc(g)}</div>`;
    h += list.map(s=>{
      const c = s.score>0?'var(--up)':s.score<0?'var(--down)':'var(--faint)';
      const sym = s.score>0?'+':s.score<0?'−':'0';
      return `<div class="sig"><div class="ico" style="color:${c};border-color:${c}">${sym}</div>
        <div><h3>${esc(s.label)}<span class="w">×${s.weight}</span></h3><p>${esc(s.text)}</p></div></div>`;
    }).join('');
  }
  h += `</div></section>`;

  if(L){
    h += `<section><h2>Key levels <span class="pill" style="color:var(--dim)">${esc(SYM)} points</span></h2><div class="card rows">
      <div class="r"><span>Futures now</span><span>${fmt(L.price)}</span></div>
      <div class="r"><span>Call wall</span><span style="color:var(--up)">${fmt(L.call_wall,0)}</span></div>
      <div class="r"><span>Gamma flip</span><span>${fmt(L.flip)}</span></div>
      <div class="r"><span>Flip at 4 PM</span><span>${fmt(L.flip_close)}</span></div>
      <div class="r"><span>Put wall</span><span style="color:var(--down)">${fmt(L.put_wall,0)}</span></div>
      ${R?`<div class="r"><span>Expected range (1σ)</span><span>${fmt(R.low,0)} – ${fmt(R.high,0)}</span></div>`:''}
      ${L.majors.map(x=>`<div class="r"><span>Major ${x.net_gex>0?'+γ':'−γ'} level</span><span style="color:${x.net_gex>0?'var(--up)':'var(--down)'}">${fmt(x.level,0)}</span></div>`).join('')}
    </div></section>`;
    if(m.profile.length) h += `<section><h2>Dealer gamma profile</h2><div class="card pad">${profile(m.profile,L)}</div></section>`;
  }

  if(D){
    const regime = D.net_gex_bn>0?['Long gamma','var(--up)']:['Short gamma','var(--down)'];
    h += `<section><h2>Dealer positioning <span class="pill" style="color:${regime[1]}">${regime[0]}</span></h2><div class="card rows">
      <div class="r"><span>Net GEX (per 1% move)</span><span style="color:${regime[1]}">${usd(D.net_gex_bn)}B</span></div>
      <div class="r"><span>Call ÷ put gamma</span><span>${fmt(D.call_put_gamma)}</span></div>
      <div class="r"><span>Dealer option delta</span><span>${usd(D.dealer_delta_bn,1)}B</span></div>
      <div class="r"><span>Charm hedge flow to close</span><span style="color:${D.charm_bn>0?'var(--up)':'var(--down)'}">${D.charm_bn>0?'Buy':'Sell'} $${fmt(Math.abs(D.charm_bn),2)}B</span></div>
      <div class="r"><span>Vanna per +1 vol pt</span><span>${usd(D.vanna_bn_per_pt)}B Δ</span></div>
      <div class="r"><span>Chains used</span><span>${D.chains.join(' + ')}</span></div>
    </div></section>`;
  }

  if(F && (F.calls_m+F.puts_m)>0){
    const tot=F.calls_m+F.puts_m, cp=(F.calls_m/tot*100).toFixed(1);
    h += `<section><h2>Options flow · prior session</h2><div class="card pad">
      <div class="flowbar"><div style="width:${cp}%"></div><div style="flex:1"></div></div>
      <div class="fl"><span style="color:var(--up)">Calls $${fmt(F.calls_m,1)}M</span><span style="color:var(--down)">Puts $${fmt(F.puts_m,1)}M</span></div>
      <div class="rows" style="margin:12px -16px -16px;border-top:1px solid var(--line)">
      ${F.top.map(t=>`<div class="r"><span>${fmt(t.level,0)} ${t.side}s</span><span style="color:${t.side==='call'?'var(--up)':'var(--down)'}">$${fmt(t.premium/1e6,1)}M</span></div>`).join('')}
      </div></div></section>`;
  }

  h += `<section><h2>Today's US calendar</h2><div class="card">${
    DATA.events.length ? DATA.events.map(e=>`<div class="ev"><div class="t">${esc(e.time)}</div><div>
      <span class="imp" style="background:${e.impact==='High'?'var(--down)':'var(--amber)'}"></span>${esc(e.title)}
      ${(e.forecast||e.previous)?`<small>fcst ${esc(e.forecast||'—')} · prev ${esc(e.previous||'—')}</small>`:''}</div></div>`).join('')
    : '<div class="ev"><div>No medium or high impact US releases.</div></div>'}</div></section>`;

  if(m.earnings.length){
    h += `<section><h2>Mega-cap earnings</h2><div class="card rows">${m.earnings.map(e=>`<div class="r"><span>${esc(e.symbol)}</span><span>${esc(e.when)}</span></div>`).join('')}</div></section>`;
  }

  const s=m.scorecard;
  h += `<section><h2>Track record · open → noon <span class="pill" style="color:var(--dim)">${s.hits}–${s.misses}</span></h2><div class="card">${
    s.recent.length ? `<div class="sc">${s.recent.map(r=>`<span style="color:${r.result==='hit'?'var(--up)':r.result==='miss'?'var(--down)':'var(--dim)'}">${r.date.slice(5)} ${r.bias[0]} ${r.move>0?'+':''}${fmt(r.move,0)}</span>`).join('')}</div>`
    : '<div class="ev"><div style="color:var(--dim)">Grades start after the first full trading day.</div></div>'}</div></section>`;

  if(DATA.notes && DATA.notes.length){
    h += `<section><h2>Data notes</h2><div class="card pad err">${DATA.notes.map(esc).join('<br>')}</div></section>`;
  }

  h += `<div class="foot">
    <p><b>How the bias is built.</b> Each signal scores +1, 0 or −1 and is weighted (×). The weighted sum is scaled to −1…+1. Above +0.12 reads Bullish and below −0.12 reads Bearish. Conviction comes from the size of the score, and it drops a notch when a high-impact US release is still ahead.</p>
    <p><b>Dealer model.</b> Positioning is estimated from CBOE open interest (15-min delayed) on the index and ETF chains, mapped into futures points with the prior-close basis. It assumes dealers are long calls and short puts. That is the standard GEX convention, not observed inventory. Flow is the prior session's premium by side, not signed buys and sells.</p>
    <p><b>Research behind the signals.</b> Barbon &amp; Buraschi, "Gamma Fragility" (2021). Baltussen, Da, Lammers &amp; Martens, "Hedging Demand and Market Intraday Momentum" (JFE 2021). Ni, Pearson &amp; Poteshman, "Stock Price Clustering on Option Expiration Dates" (JFE 2005). Gârleanu, Pedersen &amp; Poteshman, "Demand-Based Option Pricing" (RFS 2009). Pan &amp; Poteshman, "The Information in Option Volume for Future Stock Prices" (RFS 2006). Bollerslev, Tauchen &amp; Zhou, "Expected Stock Returns and Variance Risk Premia" (RFS 2009).</p>
    <p>Educational research, not financial advice.</p>
  </div>`;

  $('#app').innerHTML = h;
}

function profile(pts,L){
  const W=520,H=150,p=6, xs=pts.map(d=>d.px), ys=pts.map(d=>d.gex);
  const x0=Math.min(...xs),x1=Math.max(...xs),ym=Math.max(...ys.map(Math.abs))||1;
  const X=v=>p+(v-x0)/(x1-x0)*(W-2*p), Y=v=>H/2-v/ym*(H/2-14);
  const path=pts.map((d,i)=>(i?'L':'M')+X(d.px).toFixed(1)+','+Y(d.gex).toFixed(1)).join('');
  const area=path+`L${X(x1)},${H/2}L${X(x0)},${H/2}Z`;
  const vline=(v,c,t)=>v==null||v<x0||v>x1?'':`<line x1="${X(v)}" x2="${X(v)}" y1="10" y2="${H-4}" stroke="${c}" stroke-width="1.2" stroke-dasharray="${t==='now'?'':'3 3'}"/><text x="${X(v)+3}" y="${t==='now'?H-8:12}" fill="${c}" font-size="10" font-family="ui-monospace,monospace">${t}</text>`;
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><clipPath id="up"><rect x="0" y="0" width="${W}" height="${H/2}"/></clipPath><clipPath id="dn"><rect x="0" y="${H/2}" width="${W}" height="${H/2}"/></clipPath></defs>
    <path d="${area}" fill="var(--up)" opacity=".18" clip-path="url(#up)"/><path d="${area}" fill="var(--down)" opacity=".18" clip-path="url(#dn)"/>
    <path d="${path}" fill="none" stroke="var(--text)" stroke-width="1.4" opacity=".8"/>
    <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)"/>
    ${vline(L.flip,'var(--amber)','flip')}${vline(L.price,'var(--text)','now')}
  </svg><div class="meter-l" style="margin-top:6px"><span>${fmt(x0,0)}</span><span>long γ above line · short γ below</span><span>${fmt(x1,0)}</span></div>`;
}

$('#refresh').onclick = load;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
