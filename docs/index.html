const RS = [
 ['Macro','global','Global equities','The average move in the Nikkei, DAX and Hang Seng from their last close to the cutoff.','Equity markets transmit shocks across time zones. Asia and Europe digest overnight news before New York opens.','Hamao, Masulis & Ng, "Correlations in Price Changes and Volatility across International Stock Markets" (RFS 1990). Eun & Shim, "International Transmission of Stock Market Movements" (JFQA 1989).','Region-specific stories, like a China policy move, don\'t always carry over to US tech.'],
 ['Macro','rates','10-year yield','The 10Y Treasury futures move, converted to an approximate yield change in basis points.','Equities are long-duration assets. Higher discount rates lower the present value of future earnings, and growth and tech are hit hardest.','Bernanke & Kuttner, "What Explains the Stock Market\'s Reaction to Federal Reserve Policy?" (JF 2005).','If yields rise on strong growth data, rather than on inflation, stocks can rally anyway.'],
 ['Macro','fed','2-year / Fed path','The 2Y Treasury futures move, which tracks where traders think the Fed is heading.','The front end prices policy expectations. A hawkish repricing tightens financial conditions quickly.','Gürkaynak, Sack & Swanson, "Do Actions Speak Louder Than Words?" (IJCB 2005).','Small moves are noise. It matters most around Fed speakers, CPI and payrolls.'],
 ['Macro','dollar','US dollar','The DXY dollar index change.','A rising dollar tightens global financial conditions and dents the overseas earnings of US multinationals.','Avdjiev, Du, Koch & Shin, "The Dollar, Bank Leverage, and Deviations from Covered Interest Parity" (AER: Insights 2019).','In a risk-off flight to safety, the dollar and stocks can both be driven by the same fear, so the signal double-counts.'],
 ['Macro','oil','Crude oil','The WTI move. Only a spike above 2.5% counts, as a negative.','Oil supply shocks act as a tax on consumers and push up inflation expectations.','Kilian & Park, "The Impact of Oil Price Shocks on the U.S. Stock Market" (IER 2009).','Demand-driven oil rallies come with strong growth, which is good for stocks. The signal can\'t tell the two apart.'],
 ['Macro','credit','Credit (HYG)','The high-yield bond ETF, pre-market or at the cutoff.','Credit investors are often first to price stress. Equity rallies without credit confirmation tend to fail.','Gilchrist & Zakrajšek, "Credit Spreads and Business Cycle Fluctuations" (AER 2012).','HYG pre-market liquidity is thin, so small moves can be noise.'],
 ['Volatility','volpre','Pre-market volatility','VXX\'s pre-market change, a tradable stand-in for the VIX before its cash open.','Falling implied vol means hedges are being sold, which supports stocks through dealer flows. Rising vol means demand for protection.','Whaley, "The Investor Fear Gauge" (JPM 2000). Bollerslev, Tauchen & Zhou, "Expected Stock Returns and Variance Risk Premia" (RFS 2009).','Before events like CPI or FOMC, vol stays bid regardless of direction.'],
 ['Volatility','term','VIX term structure','VIX divided by VIX3M at yesterday\'s close.','Contango, below 0.9, is the calm backdrop where dips get bought. Backwardation, above 1.0, marks acute stress, when rallies tend to get sold.','Johnson, "Risk Premia and the VIX Term Structure" (JFQA 2017).','Backwardation can also mark capitulation lows, so the signal is early at turning points.'],
 ['Volatility','vixday','VIX today','The overnight read only. The VIX change on the day.','Vol coming out of the market into the close tends to support the overnight drift.','Whaley (2000), as above.','Same event caveats as pre-market vol.'],
 ['Dealer positioning','flip','Gamma flip','The price where dealer gamma, estimated from open interest, switches from long to short.','Above the flip, dealer hedging buys dips and sells rips, which dampens moves. Below it, hedging chases price and amplifies moves.','Barbon & Buraschi, "Gamma Fragility" (2021). Ni, Pearson, Poteshman & White, "Does Option Trading Have a Pervasive Impact on Underlying Stock Prices?" (RFS 2021).','It assumes dealers are long calls and short puts. Real inventory isn\'t public, and big customer call buying flips that assumption.'],
 ['Dealer positioning','tilt','Gamma tilt','Total call gamma divided by put gamma near the money.','Put-heavy books put dealer selling below price, while call-heavy books cushion rallies.','SqueezeMetrics, "Gamma Exposure" white paper (2017).','A low weight, since it overlaps with the flip.'],
 ['Dealer positioning','walls','Wall range','Where price sits between the largest put gamma (support) and call gamma (resistance).','Large open-interest strikes attract and pin price, especially into expiration.','Ni, Pearson & Poteshman, "Stock Price Clustering on Option Expiration Dates" (JFE 2005).','Walls can be run over on news. Treat them as magnets, not barriers. On monthly expiration Fridays the flip, walls and charm count 1.4×, and the note flags pin risk near a big strike.'],
 ['Dealer positioning','charm','Charm into close','The dealer delta change caused purely by time passing until 4 PM.','As options decay, dealers must adjust hedges. With this book, that usually means buying back futures into the afternoon.','Baltussen, Da, Lammers & Martens (JFE 2021).','It mostly affects the afternoon, not the opening half hour. It sets the regime and does not vote on direction.'],
 ['Macro','realyield','Real 10-year yield','The 10-year TIPS yield from FRED, change over the last 5 sessions.','Real rates are the discount rate on future earnings after inflation. Long-duration tech is the most sensitive to them.','Treasury inflation-protected yields; growth-stock duration (Dechow, Sloan & Soliman 2004).','When real yields rise on strong growth rather than tighter policy, stocks can hold up.'],
 ['Macro','hyoas','High-yield spreads','The ICE BofA high-yield option-adjusted spread from FRED, change over 5 sessions.','Credit investors usually price stress before stock investors do. Widening spreads lead equity weakness.','Gilchrist & Zakrajšek, Credit Spreads and Business Cycle Fluctuations (AER 2012).','Spreads can lag in fast selloffs, and energy defaults can move them for reasons that don\u2019t touch tech.'],
 ['Macro','nfci','Financial conditions','The Chicago Fed National Financial Conditions Index, change over 4 weeks.','It combines 105 measures of money markets, debt, equity and banking. Tightening conditions slow risk-taking.','Brave & Butters, Chicago Fed (2011); Adrian, Boyarchenko & Giannone, Vulnerable Growth (AER 2019).','Weekly and partly built from stock prices, so it confirms moves more than it leads them.'],
 ['Macro','liquidity','Fed net liquidity','The Fed\u2019s balance sheet minus the Treasury General Account and the reverse repo facility, change over 4 weeks.','Reserves that leave the Fed and the Treasury account end up in markets. Rising net liquidity has tracked risk assets closely since 2020.','Fed H.4.1 and NY Fed data via FRED; a widely used practitioner measure.','The relationship is loose week to week and has broken down for stretches.'],
 ['Macro','fedpressure','Fed pressure (official data)','Six official numbers the Fed watches (unemployment rate, jobless claims, payrolls, CPI, core CPI, PPI), each scored against the Fed\u2019s comfort zone: hot, in range or cool.','Hot data keeps the Fed tight, a headwind for stocks; cool data pushes it toward cuts, a tailwind. Thresholds follow your macro notes: unemployment under 4% hot and over 5.5% cool, claims under 250K hot and over 350K cool, CPI above about 2% hot, PPI above 0.2% m/m hot.','The Fed reaction function; data from FRED (St. Louis Fed).','The levels move slowly, so this is a backdrop, not a daily trigger. ISM, Chicago PMI and Conference Board confidence are licensed and not on FRED, so they aren\u2019t included.'],
 ['Macro','surprise','Data surprise','On release days, the official actual vs the consensus forecast for CPI, core CPI, PPI, payrolls, the unemployment rate and jobless claims.','Markets price the forecast in advance, so only the surprise moves the Fed outlook. Hotter than expected is bearish for stocks; cooler is bullish.','Andersen, Bollerslev, Diebold & Vega (AER 2003) on macro announcement surprises.','The first move after a release often reverses once traders read the details or revisions.'],
 ['Macro','policygap','Policy gap (2Y − Fed funds)','The 2-year Treasury yield minus the effective Fed funds rate, change over 5 sessions (FRED: DGS2, EFFR). The 10Y−3M curve (T10Y3M) is shown for context.','The gap is how far the market\'s expected Fed path sits from today\'s policy rate. A widening gap means a tighter path is being priced, a headwind for long-duration tech.','Kang, "Yield Curve Prediction with Machine Learning" (arXiv 2608.07536, 2026): Treasury-minus-Fed-funds spreads were the most important rate predictors.','FRED daily data is a day old, so this is a background vote, not an intraday one.'],
 ['Macro','stress','Financial stress','The St. Louis Fed Financial Stress Index (STLFSI4), change over 4 weeks.','It combines 18 market series (rates, spreads, volatility). Rising stress is risk-off. Its level also decides whether the market counts as calm or stressed.','St. Louis Fed, STLFSI4 methodology.','Weekly, so it moves slowly.'],
 ['Macro','macroz','Macro z-score (hawk + dove)','Six FRED series scored as z-scores of their 5-session change: inflation expectations (T5YIE), real yields (DFII10), the priced Fed path, the dollar (DTWEXBGS), high-yield spreads and financial stress.','Read twice: a hawkish lens (inflation, rates, dollar) and a dovish lens (credit and stress), then averaged. Averaging cancels one lens\'s bias.','Wang, Dai, Ma & Geng, "Macro Economists in the Machine" (arXiv 2606.08283, 2026): averaging hawkish and dovish readings corrected bias; the plain z-score rule was the baseline.','Overlaps with the real-yield and credit votes, so its weight is low.'],
 ['Macro','fomcdrift','Fed-day drift','Fed announcement days only: the 10-year yield change the day before, and whether key data (CPI, jobs, PCE…) came out in the two days before the meeting.','Long bonds tend to rally the day before a Fed decision and that has led a stock drift into the statement, but only on meetings right after key data. On the other two thirds of Fed days there is no drift at all.','Pan & Peng, "The Pre-FOMC Drift in Long-Term Treasury Bonds" (SSRN 4764451). Alam, "Learning About Fed Policy From Macro Announcements" (SSRN 4065084).','Fed days also cap conviction, because the statement can override everything.'],
 ['Volatility','vrp','Volatility risk premium','The vol index at yesterday\'s close minus the futures\' realized vol over the past month.','When protection costs much more than the market actually moves, investors are being paid to hold risk and dips tend to get bought. Realized vol above implied marks genuine stress.','Bardgett, Gourier & Leippold, "Inferring volatility dynamics and risk premia from the S&P 500 and VIX markets" (SSRN 2787161).','A slow, monthly signal, so it has a low weight. The expected move is also scaled by dealer gamma excluding same-day options (Ardia & Vaudescal, SSRN 7202999).'],
 ['Dealer positioning','vanna','Vanna','The dealer delta change caused by the pre-market move in implied vol.','When implied vol falls, the deltas of out-of-the-money options shrink, and dealers buy back hedges.','Practitioner research. See SqueezeMetrics (2017). Dealer deltas use the Hull & White (2017) minimum-variance delta, which accounts for index vol falling as prices rise.','The vol input is estimated from VXX, so it\'s rough.'],
 ['Dealer positioning','flow','Options flow (contrarian)','Short-dated index option premium, puts vs calls. Live reads only.','Index option flow carries no informed signal; if anything it is contrarian. Crowded put buying tends to unwind (a lean up), crowded call buying tends to fade (a lean down). It sits out before scheduled releases, when option buying is not informative.','Pan & Poteshman (RFS 2006), index section. Option trading around scheduled vs unscheduled news (SSRN 2544344). Our own graded history agreed: 8 of 27 right as a straight vote, 19 of 27 flipped.','Low weight. Free data can\'t separate opening buys from closing sells.'],
 ['Volatility','crush','Post-release vol','On days with a big scheduled release that is already out: did implied vol (VXX) fall or rise after it?','The more uncertain a release is, the more implied vol drops once it is out. Falling vol makes dealers buy back hedges (vanna), a tailwind. Vol rising after the print means the uncertainty didn\'t resolve.','Beber & Brandt, "Resolving Macroeconomic Uncertainty in Stock and Bond Markets" (Review of Finance 2009).','Only counts within 5 hours of a high-impact release. VXX is a rough stand-in for spot VIX.'],
 ['Macro','fedwatch','FedWatch (fed funds futures)','The next Fed meeting\'s priced outcome, rebuilt from free fed funds futures the way CME FedWatch does it, and how much it moved over 5 sessions.','More easing being priced is a tailwind for stocks; less is a headwind. FedWatch has called decisions well ahead of time. When the outcome is near certain, the Fed-day drift vote counts less, because certainty mutes the pre-Fed drift.','Bonini, Huang & Simaan, "Watching the FedWatch" (SSRN 5093703): 88% accuracy 30 days out, with economic value.','Overlaps with the 2-year and policy-gap votes. Yahoo\'s fed funds contracts can be missing on some days.'],
 ['Macro','fedleak','Pre-Fed positioning','In the 3 sessions before a Fed decision: small caps (IWM) and homebuilders (XHB) against the S&P 500 (SPY).','Institutions have traded rate-sensitive stocks in the direction of the coming policy surprise, most strongly before easing surprises. Rate-sensitive stocks outrunning the market leans bullish.','Mano, "Institutional Trading around FOMC Meetings: Evidence of Fed Leaks" (SSRN 3830271).','The paper used private trade records; public prices are a rough stand-in, and small caps move for many other reasons.'],
 ['Macro','monthend','Month-end rebalancing','Last 3 business days of the month: stocks (SPY) vs bonds (AGG) month to date.','Pension and balanced funds rebalance to fixed stock/bond weights. After a month where stocks beat bonds by a lot they have stocks to sell into month-end, and after one where bonds won they have stocks to buy. The flows are known in advance from returns.','Harvey, Mazzoleni & Melone, "The Unintended Consequences of Rebalancing" (NBER 2025).','Funds increasingly spread rebalancing over days or use thresholds, and a big news day swamps it.'],
 ['Macro','yen','Yen (USD/JPY)','The USD/JPY move. A yen rally of more than 0.6% votes bearish; yen weakness above 0.5% votes bullish. Counts double in the overnight call.','Investors borrow cheaply in yen to buy risk assets. When the yen jumps, those carry trades get unwound fast and risk is sold worldwide, hardest during Asia hours.','Brunnermeier, Nagel & Pedersen, "Carry Trades and Currency Crashes" (NBER Macroeconomics Annual 2008). The August 2024 unwind is the recent example.','A yen move driven by Japan-specific news (a Bank of Japan surprise read as one-off) can fade quickly.'],
 ['Volatility','move','Bond volatility (MOVE)','The MOVE index (Treasury implied volatility), change over 5 sessions, with its level against the past month.','Stress in the bond market tends to spill into stock volatility. Bond vol jumping is a headwind; bond vol draining out is a calmer backdrop.','Choi, Mueller & Vedolin, "Bond Variance Risk Premiums" (Review of Finance 2017).','Overlaps with the rates and VIX votes, and MOVE prints once a day.'],
 ['Macro','fomccycle','FOMC cycle week','Which week of the cycle counted from the last Fed meeting: week 0 runs from the day before to 3 days after, then weeks 2, 4 and 6.','Since 1994 nearly all of the stock market\'s excess return has come in even weeks of the Fed cycle, when Fed officials\' informal communication clusters. Odd weeks have been flat, so they don\'t vote.','Cieslak, Morse & Vissing-Jorgensen, "Stock Returns over the FOMC Cycle" (Journal of Finance 2019).','The pattern weakened after it was published, and big news in an odd week matters more.'],
 ['Macro','preholiday','Pre-holiday','The session right before a US market holiday.','Pre-holiday sessions have averaged many times a normal day\'s return: light volume, short covering and holiday mood.','Ariel, "High Stock Returns before Holidays" (Journal of Financial Economics 1990).','Weaker in recent decades and it only says the day leans up, not how much.'],
 ['Macro','refunding','Treasury refunding','The Treasury\'s quarterly refunding statement (8:30 ET, a Wednesday in early Feb, May, Aug and Nov).','How much long-dated debt Treasury plans to sell moves the term premium and yields; November 2023\'s smaller-than-feared plan set off a big rally. There\'s no free consensus to score it against, so it doesn\'t vote: it caps conviction like any big release.','Treasury quarterly refunding process; Garbade & Ingber (SSRN 678301).','A guide to risk, not direction.'],
 ['Macro','copgold','Copper vs gold','The copper/gold price ratio, change over 10 sessions.','Copper prices growth and gold prices fear. A rising ratio tracks rising growth expectations and yields; a falling one is risk-off.','A widely used practitioner gauge (Jeffrey Gundlach and others), not a peer-reviewed result.','Supply shocks in either metal (mine strikes, central-bank gold buying) move it for reasons unrelated to growth.'],
 ['Macro','yuan','Chinese yuan (USD/CNH)','The offshore yuan move. A drop of more than 0.4% votes bearish, a rally above 0.3% bullish. Counts more in the overnight call.','China stress shows up first in its currency, and sharp yuan drops have preceded Asia-led global selloffs.','The August 2015 and January 2016 yuan devaluations and the global selloffs that followed; practitioner evidence.','Managed currency: quiet most days, so it rarely votes.'],
 ['Macro','funding','Funding stress','3-month financial commercial paper minus the 3-month T-bill (FRED), scored on its level and on how jumpy it has been over the past month, each against the past year.','When banks and companies pay up to borrow short term, or that cost starts swinging around, stress tends to spread: vol rises and stocks underperform the following month. Calm, cheap funding is supportive.','Andreou & Ghysels, "Predicting the VIX and the Volatility Risk Premium: What\'s Credit and Commodity Volatility Risk Got To Do With It?" (SSRN 2510196). Their short-term funding factors were the strongest stock-return predictor they tested, beyond the VIX and the variance risk premium.','A monthly-horizon signal, and a simpler version of their factor (one spread instead of a panel), so it has a low weight.'],
 ['Macro','auction','Treasury auction','Long-end (10, 20, 30-year) Treasury auctions: the morning of an auction, then how demand came in (bid-to-cover against its recent average).','Auctions clear below market prices because dealers want paying for the risk, so yields tend to back up into a 1 PM auction. Strong demand afterwards is rates relief; weak demand is pressure.','Goldreich (SSRN 449181) and Herb (SSRN 4247371) on auction underpricing; Garbade & Ingber (SSRN 678301) on the process; Elsinger et al. (SSRN 2738381) on bidder competition.','These papers are about bond pricing, not stocks, so it is a small, rates-channel vote.'],
 ['Volatility','vxroll','VIX futures roll','(Front VIX future minus the VIX) divided by the business days to settlement, from CBOE settlements.','In contango VIX futures roll down toward a lower VIX: the calm backdrop vol sellers lean on. In backwardation the VIX doesn\'t fall, a stress backdrop. ±0.10 a day is the trading threshold.','Simon, "Trading the VIX Futures Roll and Volatility Premiums with VIX Options" (SSRN 2624713); Simon & Campasano (2014).','It predicts VIX futures more than stock direction, and it overlaps with the VIX term structure vote.'],
 ['Dealer positioning','zdte','0DTE opening flow','New York Now reads from 9:40 to 11 AM ET only: same-day SPX/NDX option volume since the open, puts vs calls, weighted by gamma.','Put-heavy opening flow has been followed by a weaker next hour and a higher chance of a fall in it.','Maurer & Müller, "Intraday 0DTE Option Order Flow and S&P 500 Downside Risk" (SSRN 7339718). The same-day gamma state also nudges the expected move ±5% (Singh, SSRN 7350465).','The authors\' own out-of-sample rule made no money: a signal about risk, not profit. Low weight.'],
 ['Dealer positioning','eodgamma','End-of-day gamma hedging','New York Now reads after 2 PM CT only: the futures move since the open, and whether dealers are long or short gamma.','Short-gamma dealers must hedge in the direction of the day\'s move, which pushes it further into the close; long-gamma dealers lean against it.','Barbon, Beckmeyer, Buraschi & Moerke, "Liquidity Provision to Leveraged ETFs and Equity Options Rebalancing Flows" (SSRN 3925725).','The one vote that uses the day\'s own price move. Dealers can time their hedging, so it isn\'t clockwork.'],

function pageResearch(D){
  const live = D ? Object.fromEntries((D.markets[SYM]||{signals:[]}).signals.map(s=>[s.key,s])) : {};
  let h = `<div class="ptitle">Research</div><div class="psub">Every vote: what it measures, why it works, the evidence, and when it fails. The badge shows how it's voting in the current ${esc(SYM)} read.</div>`;
  const groups={}; RS.forEach(r=>(groups[r[0]]=groups[r[0]]||[]).push(r));
  for(const [g,list] of Object.entries(groups)){
    h += `<section><h2>${g}</h2><div class="card">${list.map(([_,key,name,what,why,paper,fails])=>{
      const s=live[key], c=!s?'var(--line2)':s.score>0?'var(--up)':s.score<0?'var(--down)':'var(--faint)';
      return `<details class="rs"><summary><div class="ico" style="color:${c};border-color:${c}">${!s?'·':s.score>0?'+':s.score<0?'−':'0'}</div><h3>${name}${s?`<span class="w">${s.directional===false?'regime':'×'+s.weight}</span>`:''}</h3><em>›</em></summary>
        <div class="rsb"><p><b>Measures:</b> ${what}</p><p><b>Why it works:</b> ${why}</p><p><b>Fails when:</b> ${fails}</p><p class="paper">${paper}</p>${s?`<p><b>Right now:</b> ${esc(s.text)}</p>`:''}</div></details>`;}).join('')}</div></section>`;
  }
  h += `<section><h2>How it works</h2><div class="card pad foot" style="font-size:13.5px;color:var(--sub)">
    <p><b>Point-in-time.</b> Each read uses only data from before its cutoff: 8:25 AM CT for the open call, 1:50 AM CT for overnight. So the record is a fair test, not hindsight.</p>

}

      g.save(); g.translate(W*.5,H*.42); g.rotate(-.55);                          // galaxy band: many faint dust puffs
      for(let i=0;i<260;i++){ const x=(R()-.5)*W*1.8, y=(R()+R()+R()-1.5)*H*.12, r=20+R()*70;
        const warm = R()<.5, col = warm?[150,120,110]:[110,120,160], gr=g.createRadialGradient(x,y,0,x,y,r);
        gr.addColorStop(0,css(col,.035)); gr.addColorStop(1,css(col,0)); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); }
      for(let i=0;i<70;i++){ const x=(R()-.5)*W*1.6, y=(R()-.5)*H*.08, r=8+R()*26, gr=g.createRadialGradient(x,y,0,x,y,r);  // dark dust lanes
        gr.addColorStop(0,'rgba(0,0,0,.35)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); }
      g.restore();
      for(let i=0;i<n(260);i++){ const x=R()*W, y=R()*H, m=R()**3, r=.35+m*1.3, t=R();
        g.fillStyle = css(t<.2?[255,214,180]:t<.4?[190,210,255]:[235,235,245], .25+.75*m); g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
      this.sky=sky; this.tw=Array.from({length:n(30)},()=>({x:R()*W,y:R()*H,ph:R()*TAU,f:.4+R()*1.2}));
      sprites={d:glowSprite([255,240,225],6)};
      this.cxh=W*.58; this.cyh=H*.72; this.rs=Math.min(W,H)*.1*S.size;
      this.p = Array.from({length:Math.round(1500*S.amount)},()=>{ const r=this.rs*(2.3+Math.pow(R(),1.6)*4.2); return {r, a:R()*TAU, h:(R()-.5)*this.rs*.12, b:.4+R()*.6}; }); },
    temp(f){ // f: 0 inner hot → 1 outer cool; blended toward the chosen tint
      const hot=[255,246,232], mid=[255,170,92], cool=[170,52,30], base = f<.35 ? mix(hot,mid,f/.35) : mix(mid,cool,(f-.35)/.65);
      return mix(base, this.c, S.tint==='style'?0:.55); },
    frame(dt,t){
      cx.drawImage(this.sky,0,0,W,H);
      cx.globalCompositeOperation='lighter';
      for(const s of this.tw){ cx.globalAlpha=(.2+.8*Math.sin(t*s.f+s.ph)**2)*.7; cx.drawImage(sprites.d,s.x-3,s.y-3,6,6); }
      const X=this.cxh, Y=this.cyh, rs=this.rs, tilt=.2, rin=rs*2.3, rout=rs*6.5;
      // soft glow of the whole disk
      const halo=cx.createRadialGradient(X,Y,rs,X,Y,rout*1.25); halo.addColorStop(0,css(this.temp(.3),.16*S.glow)); halo.addColorStop(1,css(this.temp(.8),0));
      cx.globalAlpha=1; cx.fillStyle=halo; cx.fillRect(X-rout*1.3,Y-rout*1.3,rout*2.6,rout*2.6);
      const pass = front => {
        for(const p of this.p){
          if(!front) p.a += dt*S.speed*1.6*Math.pow(rin/p.r,1.5);
          const sa=Math.sin(p.a), ca=Math.cos(p.a); if((sa>0)!==front) continue;
          const f=(p.r-rin)/(rout-rin), dop=1+.75*ca;                     // left side (cos>0 after flip) comes toward us: brighter
          const x=X-ca*p.r, y=Y+sa*p.r*tilt+p.h, len=Math.min(.35, 6/p.r*(1+S.speed));
          cx.strokeStyle=css(this.temp(f), Math.min(1,(.12+.42*(1-f))*p.b*dop*S.glow)); cx.lineWidth=(1.5-.8*f)*Math.max(.6,S.size*.8);
          cx.beginPath(); cx.ellipse(X,Y+p.h,p.r,p.r*tilt,0,p.a-len,p.a); cx.stroke();
          if(!front && f<.7){                       // the same far-side gas, lensed into a bow over the shadow
            const rr=rs*1.32+f*rs*1.15, rx=rr*1.16, phi=TAU-Math.acos(Math.max(-1,Math.min(1,-ca)));
            cx.strokeStyle=css(this.temp(f*.9), Math.min(1,(.07+.3*(1-f))*p.b*dop*S.glow)); cx.lineWidth=1-.4*f;
            cx.beginPath(); cx.ellipse(X,Y,rx,rr,0,phi-len*.8,phi); cx.stroke();
            if(f<.35){ cx.strokeStyle=css(this.temp(f), .05*p.b*S.glow);     // faint second image under the hole
              cx.beginPath(); cx.ellipse(X,Y,rx*.92,rr*.8,0,TAU-phi-len*.6,TAU-phi); cx.stroke(); } }
        } };
      pass(false);
      cx.globalCompositeOperation='source-over'; cx.globalAlpha=1;
      const sh=cx.createRadialGradient(X,Y,rs*.9,X,Y,rs*1.25); sh.addColorStop(0,'#000'); sh.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=sh; cx.beginPath(); cx.arc(X,Y,rs*1.25,0,TAU); cx.fill();
      cx.globalCompositeOperation='lighter';
      cx.strokeStyle=css(this.temp(.05),.07*S.glow); cx.lineWidth=5; cx.beginPath(); cx.arc(X,Y,rs*1.05,0,TAU); cx.stroke();   // photon ring: soft glow
      cx.strokeStyle=css(this.temp(0),.32*S.glow); cx.lineWidth=.9; cx.beginPath(); cx.arc(X,Y,rs*1.03,0,TAU); cx.stroke();
      pass(true);
      cx.globalCompositeOperation='source-over'; cx.globalAlpha=1; }
  },
  aurora:{
    init(){ const c=rgb(tint()); this.c=[c, mix(c,[120,120,255],.55), mix(c,[255,120,200],.4)]; },
    frame(dt,t){
      cx.fillStyle='#02040a'; cx.fillRect(0,0,W,H); cx.globalCompositeOperation='lighter';
      const T = t*.18*S.speed, step = 4;
      this.c.forEach((c,k)=>{ const base = H*(.22+k*.17), amp = 34*S.size;
        for(let x=0;x<W;x+=step){
          const y = base + Math.sin(x*.012+T*(1+k*.3)+k)*amp + Math.sin(x*.031-T*1.7+k*2)*amp*.45;
          const h = (130+80*Math.sin(x*.02+T*2+k))*S.size*(.6+.4*S.amount);
          const a = (.22+.14*Math.sin(x*.05+T*3+k))*S.glow;
          const gr = cx.createLinearGradient(0,y-h,0,y); gr.addColorStop(0,css(c,0)); gr.addColorStop(.8,css(c,a)); gr.addColorStop(1,css(c,0));
          cx.fillStyle=gr; cx.fillRect(x,y-h,step,h); } });
      cx.globalCompositeOperation='source-over'; }
  },
  stars:{
    init(){ const c=rgb(tint()); this.c=c; sprites={d:glowSprite(c,8), s:starSprite(c)};
      this.s = Array.from({length:n(160)},()=>({x:R()*W,y:R()*H,z:R(),ph:R()*TAU,f:.5+R()*2}));
      this.sh = null; this.next = 1+R()*3; },
    frame(dt,t){
      const g=cx.createRadialGradient(W*.5,H*1.1,0,W*.5,H*.6,H*1.1); g.addColorStop(0,css(mix([12,14,30],this.c,.12))); g.addColorStop(1,'#010207');
      cx.fillStyle=g; cx.fillRect(0,0,W,H); cx.globalCompositeOperation='lighter';
      for(const s of this.s){ s.y += (2+6*s.z)*dt*S.speed; if(s.y>H+4){s.y=-4;s.x=R()*W;}
        cx.globalAlpha = (.25+.75*Math.sin(t*s.f+s.ph)**2)*(.3+.7*s.z)*S.glow; const r=(1+2.6*s.z)*S.size; cx.drawImage(sprites.d,s.x-r,s.y-r,r*2,r*2); }
      this.next -= dt*S.speed*S.amount;
      if(!this.sh && this.next<0){ this.sh={x:R()*W*.8+W*.2,y:R()*H*.4,vx:-(260+R()*160),vy:120+R()*80,life:0}; this.next=2+R()*5; }
      if(this.sh){ const s=this.sh; s.life+=dt*S.speed; s.x+=s.vx*dt*S.speed; s.y+=s.vy*dt*S.speed;
        const a=Math.max(0,1-s.life/1.1)*S.glow; const gr=cx.createLinearGradient(s.x,s.y,s.x-s.vx*.25,s.y-s.vy*.25);
        gr.addColorStop(0,css(mix(this.c,[255,255,255],.7),a)); gr.addColorStop(1,css(this.c,0));
        cx.strokeStyle=gr; cx.lineWidth=2*S.size; cx.lineCap='round'; cx.beginPath(); cx.moveTo(s.x,s.y); cx.lineTo(s.x-s.vx*.25,s.y-s.vy*.25); cx.stroke();
        cx.globalAlpha=a; cx.drawImage(sprites.s,s.x-12,s.y-12,24,24); if(s.life>1.1) this.sh=null; }
      cx.globalAlpha=1; cx.globalCompositeOperation='source-over'; }
  },
  off:{ init(){}, frame(){ const g=cx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#0b0d16'); g.addColorStop(1,'#05060b'); cx.fillStyle=g; cx.fillRect(0,0,W,H); } }
};

  let raf = 0, last = 0, t = 0, running = false, built = '';
  function size(){ DPR = Math.min(window.devicePixelRatio||1, 2); W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); cx.setTransform(DPR,0,0,DPR,0,0); }
  function build(){ size(); scene = SCENES[S.style]; scene.init(); built = [S.style, tint(), S.amount, S.size, W, H].join('|'); }
  function loop(now){
    const dt = Math.min(.05, (now-last)/1000) * (reduce ? .25 : 1); last = now; t += dt;
    scene.frame(dt, t); raf = requestAnimationFrame(loop);
  }
  function start(){ if(running || document.hidden) return; running = true; last = performance.now(); raf = requestAnimationFrame(loop); }
  function stop(){ running = false; cancelAnimationFrame(raf); }
  function config(p, call){
    Object.assign(S, {style:p.fx||'off', tint:p.fxTint||'style', speed:+p.fxSpeed||1, amount:+p.fxAmount||1, size:+p.fxSize||1, glow:+p.fxGlow||1, call:call||'Bearish'});
    if(S.style==='off' || !SCENES[S.style]){ stop(); cv.hidden = true; return; }
    cv.hidden = false;
    if([S.style, tint(), S.amount, S.size, window.innerWidth, window.innerHeight].join('|') !== built) build();
    start();
  }
  document.addEventListener('visibilitychange', () => { if(document.hidden) stop(); else if(S.style!=='off') start(); });
  let rt = 0; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if(S.style!=='off') build(); }, 200); });
  return { config };
})();

/* ───────── settings sheet ───────── */
function seg(key, opts, label){
  return `<div class="st"><h4>${label}</h4><div class="seg">${Object.entries(opts).map(([v,t])=>
    `<button data-k="${key}" data-v="${v}" class="${String(P[key])===v?'on':''}">${t}</button>`).join('')}</div></div>`;
}
function openSettings(){
  closeGlass();
  const t = THEMES[P.theme]||THEMES.classic;
  $('#sheetIn').innerHTML = `
    <div class="sh-top"><h3>Settings</h3><button class="hbtn" id="done">Done</button></div>
    <div class="st"><h4>Colors</h4><div class="seg">${Object.entries(THEMES).map(([k,v])=>
      `<button data-k="theme" data-v="${k}" class="${P.theme===k&&!P.up&&!P.down?'on':''}"><span class="sw"><i style="background:${v.up}"></i><i style="background:${v.down}"></i></span>${v.name}</button>`).join('')}</div>
      <div class="colors"><label>Bullish <input type="color" id="cUp" value="${P.up||t.up}"></label><label>Bearish <input type="color" id="cDown" value="${P.down||t.down}"></label></div></div>
    ${seg('bg', BG_CHOICES, P.fx!=='off' ? 'Background color (when animation is off)' : 'Background color')}
    ${seg('fx', FX_STYLES, 'Animated background')}
    ${P.fx!=='off' ? `<div class="st"><h4>Animation color</h4><div class="seg">${Object.entries(FX_TINTS).map(([v,t])=>
      `<button data-k="fxTint" data-v="${v}" class="${P.fxTint===v?'on':''}">${v.startsWith('#')?`<span class="sw"><i style="background:${v}"></i></span>`:''}${t}</button>`).join('')}</div></div>
    <div class="st rng">${[['fxSpeed','Speed',.1,2.5],['fxAmount','Amount',.2,2.5],['fxSize','Size',.5,2],['fxGlow','Brightness',.2,1.8]].map(([k,l,mn,mx])=>
      `<label for="r-${k}"><span>${l}</span><output id="o-${k}">${Math.round(P[k]*100)}%</output></label><input type="range" id="r-${k}" data-r="${k}" min="${mn}" max="${mx}" step="0.05" value="${P[k]}">`).join('')}</div>` : ''}
    ${seg('size', {s:'Small', m:'Medium', l:'Large'}, 'Text size')}
    ${seg('density', {comfortable:'Comfortable', compact:'Compact'}, 'Layout')}
    ${seg('reasons', {true:'Show data', false:'Bars only'}, 'Vote detail')}
    ${seg('market', {NQ:'NQ', ES:'ES'}, 'Open on')}
    <div class="st"><h4>Today page sections</h4><div class="card">${P.order.map((k,i)=>`
      <div class="secrow"><span>${SECTIONS[k]}</span>
        <button class="mv" data-mv="${i}" data-d="-1" ${i===0?'disabled style="opacity:.3"':''}>↑</button>
        <button class="mv" data-mv="${i}" data-d="1" ${i===P.order.length-1?'disabled style="opacity:.3"':''}>↓</button>
        <button class="tg ${P.hidden.includes(k)?'':'on'}" data-tg="${k}" aria-label="Show ${SECTIONS[k]}"></button></div>`).join('')}</div></div>
    <button class="reset" id="reset">Reset to defaults</button>`;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSettings(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
function changed(){ save(); applyPrefs(); if(ROOT) render(); const y=$('#sheet').scrollTop; openSettings(); $('#sheet').scrollTop=y; }
$('#sheet').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='done') return closeSettings();
  if(b.id==='reset'){ P={...DEFAULTS, order:[...DEFAULTS.order], hidden:[]}; SYM=P.market; return changed(); }
  if(b.dataset.k){ let v=b.dataset.v; if(v==='true'||v==='false') v=(v==='true');
    P[b.dataset.k]=v; if(b.dataset.k==='fx') P.fxSet=true; if(b.dataset.k==='bg') P.bgSet=true; if(b.dataset.k==='theme'){P.up=null;P.down=null;} if(b.dataset.k==='market') SYM=v; return changed(); }
  if(b.dataset.mv){ const i=+b.dataset.mv, j=i+(+b.dataset.d); [P.order[i],P.order[j]]=[P.order[j],P.order[i]]; return changed(); }
  if(b.dataset.tg){ const k=b.dataset.tg; P.hidden = P.hidden.includes(k) ? P.hidden.filter(x=>x!==k) : [...P.hidden,k]; return changed(); }
});
$('#sheet').addEventListener('input', e=>{
  const k = e.target.dataset && e.target.dataset.r;
  if(k){ P[k] = +e.target.value; const o=$('#o-'+k); if(o) o.textContent = Math.round(P[k]*100)+'%'; save(); try{ FX.config(P, CALL); }catch(err){} return; }
  if(e.target.id==='cUp'){ P.up=e.target.value; save(); applyPrefs(); if(ROOT) render(); }
  if(e.target.id==='cDown'){ P.down=e.target.value; save(); applyPrefs(); if(ROOT) render(); }
});
$('#gear').onclick = openSettings;
$('#scrim').onclick = () => { closeGlass(); closeSettings(); closePop(); };
$('#popX').onclick = closePop;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePop(); });
$('#refresh').onclick = () => load(true);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
applyPrefs(); shell(); load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
