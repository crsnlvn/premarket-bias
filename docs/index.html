<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-Market Bias</title>
<meta name="theme-color" content="#16171D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bias">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-b-180.png">
<link rel="icon" href="icons/icon-b-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d; --text:#f4f6fb; --sub:rgba(235,240,250,.74); --dim:rgba(235,240,250,.52); --faint:rgba(235,240,250,.34);
  --glass:rgba(255,255,255,.07); --edge:rgba(255,255,255,.15); --hi:rgba(255,255,255,.22); --sel:rgba(255,255,255,.15);
  --row:rgba(255,255,255,.07); --track:rgba(0,0,0,.28); --bar:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.35); --solid:rgba(16,19,28,.9);
  --up:#5ef2b0; --down:#ff6b8b; --flat:#a7b0c0; --amber:#ffc35a; --accent:#ffffff;
  --blob1:rgba(255,107,139,.5); --blob2:rgba(60,110,255,.42); --blob3:rgba(0,200,170,.2); --blob4:transparent;
  --sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif; --mono:var(--sans);
  --pad:16px; --gap:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
html,body{color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 100px);min-height:100vh}
body{position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;transition:background 1.2s ease;
  background:radial-gradient(42% 32% at 12% 30%,var(--blob1),transparent 70%),radial-gradient(48% 36% at 95% 4%,var(--blob2),transparent 70%),
             radial-gradient(40% 30% at 90% 78%,var(--blob3),transparent 70%),radial-gradient(34% 26% at 32% 46%,var(--blob4),transparent 70%)}
:root[data-mode="vivid"] body::before{display:none}
.mesh{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none;display:none}
:root[data-mode="vivid"] .mesh{display:block}
.mesh i{position:absolute;border-radius:50%;filter:blur(70px);transform:translateZ(0)}
.mesh i:nth-child(1){width:520px;height:520px;left:-210px;top:150px;background:#ff1f5a;opacity:.95}
.mesh i:nth-child(2){width:560px;height:560px;right:-240px;top:-120px;background:#2a4bff;opacity:.95}
.mesh i:nth-child(3){width:420px;height:420px;left:40px;top:330px;background:#c21bd6;opacity:.55}
.mesh i:nth-child(4){width:460px;height:460px;right:-200px;top:780px;background:#00c49a;opacity:.55}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;display:block}
#fx[hidden]{display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num,.stamps,.rows .r > span:last-child,.ev .t,.big b,.fl{font-variant-numeric:tabular-nums}

/* glass */
.g,.card,.hero,.tabbar,.glass,.sheet,.toast,.big > div{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 12px 40px var(--shadow)}

/* header */
header{padding:12px 0 2px}
.top,.row2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2{margin-top:10px}
.btns{display:flex;gap:8px}
.segc{display:flex;padding:3px;border-radius:999px;gap:2px}
.segc button{font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s}
.segc button.on{color:var(--text);background:var(--sel);box-shadow:inset 0 1px 0 var(--hi)}
.tab .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.ib svg{width:18px;height:18px}
.spin svg{animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.brand{display:none}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.live.stale{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.ptitle{font-size:34px;font-weight:700;letter-spacing:-.04em;margin:22px 4px 4px}
.psub{font-size:14px;color:var(--dim);line-height:1.5;margin:0 4px}

/* hero */
.hero{margin-top:16px;border-radius:30px;padding:20px 20px 18px}
.kicker{font-size:13.5px;color:var(--dim);font-weight:500;display:flex;align-items:center;gap:8px}
.bias{font-size:62px;font-weight:700;letter-spacing:-.045em;line-height:1.02;margin:8px 0 8px;
  background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 68%,var(--text)));-webkit-background-clip:text;background-clip:text;color:transparent}
.conv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--sel);border:1px solid var(--edge)}
.tug{margin-top:22px}
.track{position:relative;display:flex;height:22px;border-radius:999px;padding:4px;background:var(--track);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.side{width:50%;display:flex;gap:2px}
.side.bear{flex-direction:row-reverse;padding-right:3px}
.side.bull{padding-left:3px}
.side i{display:block;height:100%;border-radius:999px}
.needle{position:absolute;top:-6px;bottom:-6px;width:8px;margin-left:-4px;border-radius:999px;background:var(--text);
  box-shadow:0 0 0 3px var(--sel),0 2px 10px rgba(0,0,0,.4);animation:nd .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes nd{from{left:50%}}
.tl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:10px;font-weight:500}
.note{font-size:15.5px;color:var(--sub);margin-top:16px;line-height:1.5}
.note b{color:var(--text);font-weight:600}
.flipv{margin-top:12px;font-size:13.5px;color:var(--sub);padding:10px 12px;border-radius:14px;background:var(--bar)}
.mode{font-size:13px;color:var(--dim);margin-top:14px;line-height:1.5}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--row)}
.stamps div{font-size:13.5px;font-weight:600}
.stamps span{display:block;font-size:12px;color:var(--faint);font-weight:500}
.stamps em{display:block;font-style:normal;font-size:12px;color:var(--dim);font-weight:500}
.stamps .warn{grid-column:1/-1;color:var(--amber)}
.flash{animation:fl 1.2s ease}
@keyframes fl{0%{opacity:.35}100%{opacity:1}}

/* widget grid */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.t{border-radius:28px;padding:16px;min-width:0;text-align:left}
.t.wide{grid-column:1/-1}
.lbl{font-size:12.5px;font-weight:600;color:var(--dim)}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 16px}
.tc{font-size:16px;font-weight:650}
.callword{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1}
.conv-pill{margin-bottom:6px}
.hero-t .tug{margin-top:0}
.tv{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:8px}
.ts{font-size:12.5px;color:var(--dim);margin-top:2px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;border-top:1px solid var(--row)}
.mrow:nth-child(2){border-top:0}
.mrow span:last-child{font-weight:650}
.mini-call{cursor:pointer;font:inherit;color:inherit}
.mini-call .tc{font-size:20px;font-weight:700;margin-top:8px}
.t .stamps{border-top:1px solid var(--row)}
body.compact .callword{font-size:42px}

/* blocks */
section{margin-top:var(--gap)}
h2{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:0 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card{border-radius:24px;overflow:hidden}
.pad{padding:var(--pad)}
.idea{font-size:15.5px;line-height:1.5}
.inval{margin-top:12px;font-size:14px;color:var(--dim)}
.inval b{color:var(--text);font-weight:600}
.pill{font-size:12.5px;font-weight:600;letter-spacing:0;padding:4px 10px;border-radius:999px;background:var(--sel);border:1px solid var(--edge);white-space:nowrap}
.grp{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--dim);padding:14px var(--pad) 4px}
.grp span:last-child{font-weight:500;color:var(--faint)}
.sig{padding:12px var(--pad);border-top:1px solid var(--row)}
.grp + .sig{border-top:0}
.sig-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sig h3{font-size:15.5px;font-weight:600}
.sig p{font-size:13.5px;line-height:1.45;color:var(--dim);margin-top:3px}
.w{font-size:12px;color:var(--faint);margin-left:6px;font-weight:500}
.nov{flex:none;font-size:11px;font-weight:600;color:var(--dim);padding:3px 8px;border-radius:99px;background:var(--bar)}
.wtag{all:unset;font-size:12px;color:var(--faint);margin-left:6px;font-weight:500;font-style:normal}
.vbar{flex:none;position:relative;width:70px;height:6px;border-radius:999px;background:var(--bar)}
.vbar i{position:absolute;top:0;bottom:0;border-radius:999px}
.ico{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid;display:grid;place-items:center;font-size:13px;font-weight:700}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px var(--pad);border-top:1px solid var(--row);font-size:15px}
.rows .r:first-child{border-top:0}
.rows .r > span:first-child{color:var(--sub)}
.rows .r > span:last-child{font-weight:600;text-align:right}
.rows small{display:block;font-size:12px;color:var(--faint);font-weight:500}
.flowbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:4px 0 8px;gap:2px}
.fl{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
svg.prof{display:block;width:100%;height:150px}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);gap:6px}
.ev{display:flex;gap:14px;padding:12px var(--pad);border-top:1px solid var(--row);font-size:15px}
.ev:first-child{border-top:0}
.ev .t{color:var(--dim);width:68px;flex:none;font-weight:500}
.ev small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.dayhead{font-size:13px;font-weight:600;color:var(--dim);padding:14px var(--pad) 2px;border-top:1px solid var(--row)}
.card > .dayhead:first-child{border-top:0}
.dayhead.today{color:var(--text)}
.imp{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.foot{font-size:13px;line-height:1.6;color:var(--dim);margin:0 4px}
.foot p{margin-bottom:10px}
.foot b{color:var(--sub);font-weight:600}
.err{color:var(--amber);font-size:13px;line-height:1.6}
.empty{padding:80px 4px;color:var(--dim);font-size:16px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:999px;background:var(--sel);border:1px solid var(--edge);font-size:15px;font-weight:600}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}

/* record */
.big{display:flex;gap:10px}
.big > div{flex:1;border-radius:24px;padding:16px}
.big b{display:block;font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:4px}
.big span{font-size:13px;font-weight:600;color:var(--dim)}
.big small{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}
.bar{height:6px;border-radius:999px;background:var(--bar);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:999px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:var(--pad)}
.dots span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#05070d;font-weight:700}

/* research */
details.rs{border-top:1px solid var(--row)}
.card > details.rs:first-child{border-top:0}
details.rs summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px var(--pad);cursor:pointer}
details.rs summary::-webkit-details-marker{display:none}
details.rs summary h3{flex:1;font-size:15.5px;font-weight:600}
details.rs summary em{font-style:normal;font-size:16px;color:var(--faint);transition:transform .2s}
details.rs[open] summary em{transform:rotate(90deg)}
.rsb{padding:0 var(--pad) 16px 50px;font-size:14px;line-height:1.55;color:var(--sub)}
.rsb p{margin-top:8px}
.rsb b{color:var(--text);font-weight:600}
.rsb .paper{font-size:12.5px;color:var(--dim)}

/* journal */
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--track);border:1px solid var(--edge);border-radius:14px;padding:11px 13px;font-size:16px}
.field textarea{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{flex:1;min-width:80px;font-size:14px;font-weight:600;padding:10px 6px;border-radius:999px;color:var(--dim);background:var(--bar);border:1px solid transparent}
.chips button.on{color:var(--text);background:var(--sel);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.jrow{padding:12px var(--pad);border-top:1px solid var(--row);font-size:14.5px}
.jrow:first-child{border-top:0}
.jrow .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--dim)}
.jrow p{margin-top:6px;color:var(--sub);line-height:1.5}
.jrow .del{color:var(--faint);font-size:13px;margin-top:6px}

/* floating tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:12;
  width:calc(100% - 32px);max-width:528px;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--solid)}
.tabbar button{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--dim);padding:10px 0;border-radius:999px;transition:background .2s,color .2s}
.tabbar button svg{display:none}
.tabbar button.on{color:var(--text);background:var(--sel);box-shadow:inset 0 1px 0 var(--hi)}

/* "More" panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.glass{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:22;width:calc(100% - 32px);max-width:528px;
  transform:translate(-50%,16px) scale(.97);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.8,.2,1);
  padding:8px 18px 6px;border-radius:28px;background:var(--solid)}
.glass.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.glass h4{font-size:13px;font-weight:600;color:var(--dim);margin:8px 0 2px;display:flex;justify-content:space-between}
.glass{display:flex;flex-direction:column;max-height:calc(100dvh - env(safe-area-inset-bottom) - 150px)}
.glass .tiles{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;flex:1}
.gsearch{display:flex;align-items:center;gap:8px;margin:8px 0 4px;padding:0 12px;height:40px;border-radius:12px;background:var(--bar)}
.gsearch svg{width:17px;height:17px;color:var(--dim);flex:none}
.gsearch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px}
.gnone{padding:16px 0;color:var(--dim);font-size:14px}
.fstrip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px 0 0;padding:0 20px 4px 0;scrollbar-width:none}
.fstrip::-webkit-scrollbar{display:none}
.fcard{flex:none;width:150px;scroll-snap-align:start;padding:14px 14px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);display:flex;flex-direction:column}
.fcard b{font-size:15.5px;font-weight:600}
.fcard .fc{font-size:13px;color:var(--dim);margin-top:2px}
.fcard i{display:block;border-top:1px dashed var(--line2);margin:10px 0 12px;opacity:.7}
.fcard svg{margin-bottom:8px}
.fcard .fp{font-size:17px;font-weight:600}
.fcard .fx{font-size:14px;margin-top:2px}
.mrow2{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;align-items:center;gap:12px;padding:12px var(--pad);border-top:1px solid var(--row)}
.mrow2:first-child{border-top:0}
.mrow2 .mt{display:flex;flex-direction:column;gap:2px}.mrow2 .mt small{font-size:12px}
.mrow2 .ms{display:flex;justify-content:center}
.mrow2 .mvl{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px;white-space:nowrap;min-width:70px}.mrow2 .mvl b{font-size:15.5px}
.hp{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 16px;border-top:1px solid var(--row);color:var(--text)}
.hp:first-child{border-top:0}
.hpi{width:20px;height:20px;color:var(--dim);flex:none;margin-top:2px}.hpi svg{width:20px;height:20px}
.hpt{flex:1;min-width:0;text-align:left}
.tiles{display:flex;flex-direction:column}
.tiles button{display:flex;align-items:center;gap:12px;padding:13px 0;text-align:left;border-top:1px solid var(--row)}
.tiles button:first-child{border-top:0}
.tiles svg{width:20px;height:20px;color:var(--dim);flex:none}
.tiles span{display:flex;justify-content:space-between;align-items:baseline;width:100%;gap:12px}
.tiles b{font-size:16px;font-weight:600}
.tiles small{font-size:13px;color:var(--dim)}
.tiles button.on svg,.tiles button.on b{color:var(--text)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--solid);color:var(--text);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}

/* compact layout */
body.compact{--pad:12px;--gap:18px}
body.compact .sig p{display:none}
body.compact .sig{padding-top:10px;padding-bottom:10px}
body.compact .bias{font-size:50px}
body.compact .note{font-size:14.5px}

/* settings sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;background:var(--solid);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:25;padding:0 0 calc(env(safe-area-inset-bottom) + 20px)}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto;padding:0 18px}
.sh-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px;z-index:1;background:transparent;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sh-top h3{font-size:24px;font-weight:700;letter-spacing:-.03em}
.hbtn{font-size:15px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--sel);border:1px solid var(--edge)}
.st{margin-top:20px}
.st h4{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:70px;font-size:14px;font-weight:600;padding:10px 8px;border-radius:999px;color:var(--dim);background:var(--bar);border:1px solid transparent}
.seg button.on{color:var(--text);background:var(--sel);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}

button.t{display:block;width:100%;font:inherit;color:inherit;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1)}

  transform:translate(-50%,40px) scale(.96);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.9,.25,1),opacity .2s;
  border-radius:32px;background:color-mix(in srgb,var(--solid) 82%,transparent);border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--hi),0 30px 80px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(36px) saturate(180%);backdrop-filter:blur(36px) saturate(180%)}

:root[data-mode="quant"] .g,:root[data-mode="quant"] .card,:root[data-mode="quant"] .big>div,:root[data-mode="quant"] .toast{
  background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border:0;border-radius:0}
:root[data-mode="quant"] .card{border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
:root[data-mode="quant"] .toast{background:#16181B;border:1px solid var(--edge);border-radius:4px}
:root[data-mode="quant"] .tabbar{left:0;right:0;transform:none;bottom:0;width:100%;max-width:none;border-radius:0;padding:10px 0 calc(env(safe-area-inset-bottom) + 10px);
  background:var(--bg);border:0;border-top:1px solid var(--edge);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-mode="quant"] .tabbar button{font-size:11.5px;font-weight:500;border-radius:0;padding:6px 0;text-transform:lowercase}
:root[data-mode="quant"] .tabbar button.on{background:none;box-shadow:none;color:var(--amb)}
:root[data-mode="quant"] .tabbar button.on::before{content:"["}
:root[data-mode="quant"] .tabbar button.on::after{content:"]"}
:root[data-mode="quant"] .glass,:root[data-mode="quant"] .sheet{background:#101214;border:1px solid var(--edge);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:6px}

:root[data-mode="quant"] .glass{bottom:calc(env(safe-area-inset-bottom) + 58px)}
:root[data-mode="quant"] header{padding:10px 16px 8px;border-bottom:1px solid var(--edge)}
:root[data-mode="quant"] .segc{background:none;border:0;box-shadow:none;padding:0;gap:0;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-mode="quant"] .segc button{font-size:12.5px;font-weight:500;padding:4px 0;border-radius:0;color:var(--dim)}
:root[data-mode="quant"] .segc button.on{background:none;box-shadow:none;color:var(--amb)}
:root[data-mode="quant"] #tabs button + button::before{content:"/";color:var(--faint);margin:0 6px}
:root[data-mode="quant"] #vt{padding-left:10px;margin-left:10px;border-left:1px solid var(--edge)}
:root[data-mode="quant"] #vt button + button::before{content:"·";color:var(--faint);margin:0 7px}
:root[data-mode="quant"] .tab .dot{display:none}
:root[data-mode="quant"] .ib{width:28px;height:28px;border-radius:4px;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--dim)}
:root[data-mode="quant"] .ib svg{width:15px;height:15px}
:root[data-mode="quant"] section{margin-top:18px}
:root[data-mode="quant"] h2{font-family:var(--qm);font-size:11px;font-weight:500;color:var(--dim);letter-spacing:0;margin:0 16px 6px;text-transform:lowercase}
:root[data-mode="quant"] .ptitle{font-family:var(--qd);font-size:26px;margin:16px 16px 2px}
:root[data-mode="quant"] .psub,:root[data-mode="quant"] .foot{margin:0 16px}
:root[data-mode="quant"] .pill,:root[data-mode="quant"] .chip,:root[data-mode="quant"] .hbtn{border-radius:3px;background:none}

:root[data-mode="quant"] .sig p{font-size:11.5px}

.sch.on span{color:var(--amb)!important}

function modeNow(){

  return P.bg==='auto' ? (sysDark && !sysDark.matches ? 'light' : 'dark') : BGS[P.bg].mode; }
function shade(hex, amt){ // mix a color toward black so it reads on light glass
  const n=parseInt(hex.slice(1),16), f=c=>Math.round(c*(1-amt)).toString(16).padStart(2,'0');
  return '#'+f(n>>16&255)+f(n>>8&255)+f(n&255);
}
let CALL = null;   // Bullish / Bearish of the read on screen: tints the ambient glow
function applyPrefs(){
  const r = document.documentElement.style, t = THEMES[P.theme]||THEMES.classic, mode = modeNow();
  const b = P.bg==='auto' ? BGS[mode] : BGS[P.bg];
  for(const [k,v] of Object.entries(MODE[mode])) r.setProperty('--'+k, v);
  r.setProperty('--bg', b.bg); r.setProperty('--blob2', b.blob2); r.setProperty('--blob3', b.blob3);
  let up = P.up||t.up, down = P.down||t.down;
  if(mode==='light'){ up = shade(up,.38); down = shade(down,.18); }
  if(mode==='vivid' && !P.down && P.theme==='classic') down = '#ff5c8a';   // reads cleaner on the pink
  let accent = null;
  if(mode==='calm'){ if(P.theme==='classic'){ if(!P.up) up = '#4FD1A1'; if(!P.down) down = '#F2778F'; } accent = '#7AA2F7'; }
  if(mode==='wc' && P.theme==='classic'){ if(!P.up) up = '#3EE07A'; if(!P.down) down = '#FF453A'; }
  if(mode==='qc' && P.theme==='classic'){ if(!P.up) up = '#3DDC97'; if(!P.down) down = '#FF5C5C'; }
  if(mode==='widget' && P.theme==='classic'){ if(!P.up) up = '#3EE07A'; if(!P.down) down = '#FF453A'; }
  if(mode==='quant' && P.theme==='classic'){ if(!P.up) up = '#3DDC97'; if(!P.down) down = '#FF5C5C'; }
  r.setProperty('--up', up); r.setProperty('--down', down); r.setProperty('--accent', accent || up);
  const glow = CALL==='Bearish' ? down : CALL==='Bullish' ? up : null;
  r.setProperty('--blob1', (mode==='vivid'||mode==='calm') ? 'transparent' : glow ? `color-mix(in srgb, ${glow} ${mode==='light'?45:(mode==='widget'||mode==='wc')?24:50}%, transparent)` : 'transparent');

}

const tET = d => d.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'})+' ET';
const tCT = d => d.toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'})+' CT';
const tLocal = (d,sec) => d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',...(sec?{second:'2-digit'}:{})});
const dayLocal = d => d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dayOf = iso => new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
function ago(d){
  const m = Math.round((Date.now()-d)/60000);
  if(m<1) return 'just now'; if(m<60) return m+' min ago';
  const h=Math.floor(m/60); if(h<24) return h+' hr '+(m%60)+' min ago';
  const dd=Math.floor(h/24); return dd+' day'+(dd>1?'s':'')+' ago';
}
function nextRun(){   // mirrors the GitHub schedule (UTC): weekdays :07/:22/:37/:52 from 12 to 14, plus every hour at :40 Sun–Fri
  const now=new Date(), pre=[12,13,14].flatMap(h=>[7,22,37,52].map(m=>[h,m,true]));
  const slots=[...Array(24).keys()].map(h=>[h,40,false]).concat(pre).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  for(let i=0;i<10;i++) for(const [h,mi,weekdayOnly] of slots){
    const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+i,h,mi)), wd=d.getUTCDay();
    if(weekdayOnly ? (wd>=1&&wd<=5) : wd<=5) if(d>now) return d;
  }
}

let ROOT=null, SYM=P.market, CHECKED=null, VIEW='preopen', SESSION='ny', PAGE='today';

function readFor(sess=SESSION, view=VIEW){
  if(!ROOT) return null;
  if(!ROOT.ny) return ROOT.preopen ? ((view==='now'&&ROOT.now)||ROOT.preopen) : ROOT;   // older formats
  if(sess==='overnight') return ROOT.overnight;
  return (view==='now' && ROOT.ny.now) ? ROOT.ny.now : ROOT.ny.preopen;
}

async function load(manual){
  $('#refresh').classList.add('spin');
  const before = ROOT && ROOT.generated; let ok=false;
  try{
    const r = await fetch('data/latest.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    ROOT = await r.json(); ok=true; CHECKED=new Date();
  }catch(e){ if(!ROOT) $('#app').innerHTML='<div class="empty">No report yet. The first one arrives with the next run.</div>'; }
  $('#refresh').classList.remove('spin');
  if(ROOT) render();
  if(manual){
    const n=nextRun();
    if(!ok) toast('Could not reach the server. Showing the last report.');
    else if(before && before!==ROOT.generated) toast('New data loaded');
    else toast('Up to date. Next update '+dayLocal(n)+' at '+tLocal(n)+'.');
    const c=$('#checkedRow'); if(c){ c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
  }
}
setInterval(()=>{ const D=readFor(); if(!D) return;
  const a=$('#agoTxt'); if(a) a.textContent=ago(new Date(D.generated));
  const c=$('#chkAgo'); if(c&&CHECKED) c.textContent=ago(CHECKED); }, 30000);

function shell(){
  const D = readFor();
  const call = D && D.markets[SYM] ? D.markets[SYM].bias.bias : null;
  if(call !== CALL){ CALL = call; applyPrefs(); }
  // header: market tabs, session switch, Pre-open/Now only where it applies
  const syms = D ? Object.keys(D.markets) : ['NQ','ES'];
  if(!syms.includes(SYM)) SYM = syms[0];
  $('#tabs').innerHTML = syms.map(s=>`<button class="tab ${s===SYM?'on':''}" data-s="${s}">${s}${D?`<span class="dot" style="background:${C(D.markets[s].bias.bias)}"></span>`:''}</button>`).join('');
  $$('#tabs .tab').forEach(t=>t.onclick=()=>{SYM=t.dataset.s;render();window.scrollTo({top:0})});
  $('#vt').style.display = (['today','levels','record'].includes(PAGE) && ROOT && ROOT.ny) ? '' : 'none';
  $$('#vt button').forEach(b=>b.classList.toggle('on', SESSION==='overnight' ? b.dataset.view==='overnight' : b.dataset.view===VIEW));
  $('.brand').innerHTML = `<span class="live ${D && D.date!==todayET() && SESSION==='ny' ? 'stale':''}" id="live"></span><b>${SESSION==='overnight'?'Overnight':VIEW==='now'?esc(winName(D)):'NY open'}</b> Bias`;
  // tab bar
  $('#tabbar').innerHTML = BAR.map(k=>`<button data-p="${k}" class="${PAGE===k?'on':''}">${I[k]}${PAGES[k].tab||PAGES[k].name}</button>`).join('')
    + `<button data-p="all" class="${!BAR.includes(PAGE)?'on':''}">${I.all}More</button>`;
  $$('#tabbar button').forEach(b=>b.onclick=()=> b.dataset.p==='all' ? openGlass() : go(b.dataset.p));
  const hb=$('#helpbtn'); if(hb) hb.onclick=()=>go('help');
}
const todayET = () => new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
function go(p){ PAGE=p; closeGlass(); render(); window.scrollTo({top:0}); }

function openGlass(){
  $('#glass').innerHTML = `<h4><span>Pages</span><span>${esc(SYM)}, ${SESSION==='overnight'?'overnight':VIEW==='now'?esc(winName(readFor()))+' session':'NY open'}</span></h4>
    <div class="gsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="gq" type="search" placeholder="Search pages and tools" autocomplete="off"></div>
    <div class="tiles" id="gtiles">${Object.entries(PAGES).map(([k,v])=>`<button data-p="${k}" data-q="${esc((v.name+' '+v.sub+' '+(HELP[k]||'')).toLowerCase())}" class="${PAGE===k?'on':''}">${I[k]||''}<span><b>${v.name}</b><small>${v.sub}</small></span></button>`).join('')}<div class="gnone" style="display:none">Nothing matches.</div></div>`;
  $$('#glass .tiles button').forEach(b=>b.onclick=()=>go(b.dataset.p));
  $('#gq').oninput = e => { const q=e.target.value.trim().toLowerCase(); let n=0;
    $$('#gtiles button').forEach(b=>{ const ok=!q || q.split(/\s+/).every(w=>b.dataset.q.includes(w)); b.style.display=ok?'':'none'; n+=ok; });
    $('#gtiles .gnone').style.display = n ? 'none' : ''; };
  $('#scrim').classList.add('on'); $('#glass').classList.add('on');
}
function closeGlass(){ $('#glass').classList.remove('on'); if(!$('#sheet').classList.contains('on')) $('#scrim').classList.remove('on'); }

function setView(v, quiet){
  if(v==='overnight'){
    if(!(ROOT && ROOT.overnight)){ toast('No overnight read yet. It previews from 3 PM CT and locks at 1:50 AM CT.'); return false; }
    SESSION='overnight';
  } else {
    if(v==='now' && ROOT && ROOT.ny && !ROOT.ny.now){ toast('No Now read yet. It shows up after the next run.'); return false; }
    SESSION='ny'; VIEW=v;
  }
  render(); window.scrollTo({top:0});
  if(!quiet) toast(v==='now' ? 'Now: Asia 5 PM to 2 AM CT, New York 9 AM to 3 PM CT' : v==='overnight' ? 'Overnight: London, 2 to 8 AM CT' : 'Pre-open: the 8:30 to 9:00 CT move');
  return true;
}
$$('#vt button').forEach(b=>b.onclick=()=>setView(b.dataset.view));

function render(){
  shell();
  const D = readFor();
  if(!D && !['research','journal','red','clock'].includes(PAGE)){ $('#app').innerHTML='<div class="empty">No read for this session yet. It arrives with the next run.</div>'; return; }
  $('#app').innerHTML = ({today:pageToday, levels:pageLevels, macro:pageMacro, record:pageRecord, research:pageResearch, journal:pageJournal, red:pageRed, clock:pageClock, gap:pageGap, news:pageNews, gammap:pageGammaMap, ladder:pageLadder, megacaps:pageMega, heatmap:pageHeat, bigtrades:pageBig, volcurve:pageVol, strikes:pageStrikes, drivers:pageDrivers, world:pageWorld, help:pageHelp}[PAGE])(D);
  if(PAGE==='clock') wireClock();
  if(PAGE==='news') wireNews();
  if(PAGE==='help') $$('[data-go-page]').forEach(b=>b.onclick=()=>go(b.dataset.goPage));
  $$('[data-w]').forEach(t=>t.onclick=()=>{ WOPEN = WOPEN===t.dataset.w ? null : t.dataset.w; store.set('wopen', WOPEN); render(); });
  $$('[data-page]').forEach(t=>t.onclick=()=>go(t.dataset.page));
  $$('[data-pop]').forEach(t=>t.onclick=()=>openPop(t.dataset.pop));
  if(PAGE==='journal') wireJournal();
  if(PAGE==='levels'){ const c=$('#copyLv'); if(c) c.onclick=copyLevels; }
  $$('[data-go]').forEach(t=>t.onclick=()=>{ const [s,v]=t.dataset.go.split('|'); SESSION=s; if(s==='ny') VIEW=v; render(); window.scrollTo({top:0}); });
}

function modeLine(D){
  if(SESSION==='overnight') return D && D.mode==='live' ? 'Live preview, locks at 1:50 AM CT. Graded 2 to 8 AM CT.' : 'Locked at 1:50 AM CT. Graded 2 to 8 AM CT.';
  if(VIEW==='now') return `Built from data up to ${tET(new Date(D.as_of))}. Graded when the session ends.`;
  return D.mode==='point-in-time' ? 'Built from data up to 8:25 CT, nothing later. Graded at 9:00 CT.' : 'Live preview until it locks at 8:25 CT. Graded at 9:00 CT.';
}
// first sentence of a signal's text: the data, not the commentary
function lead(t){
  t = String(t||'');
  const m = t.match(/^[\s\S]*?[.!?](?=\s+(?:[A-Z]|$))/);
  let out = m ? m[0] : t;
  if(/Latest:/.test(t)) out = t.replace(/\s+The news flow[^.]*\.\s*$/, '');
  return out;
}
function vbar(s){
  const L = Math.min(s.weight/1.5, 1)*50, c = s.score>0?'var(--up)':'var(--down)';
  if(!s.score || s.directional===false && !s.weight) return '<span class="vbar"></span>';
  return `<span class="vbar"><i style="${s.score>0?'left':'right'}:50%;width:${L}%;background:${c};box-shadow:0 0 10px ${c}"></i></span>`;
}
function tug(m){
  const sigs = m.signals.filter(s=>s.directional!==false && s.weight>0), T = sigs.reduce((a,s)=>a+s.weight,0)||1;
  const up = sigs.filter(s=>s.score>0).sort((a,b)=>b.weight-a.weight), dn = sigs.filter(s=>s.score<0).sort((a,b)=>b.weight-a.weight);
  const seg = (L,c) => L.map((s,i)=>`<i title="${esc(s.label)}" style="width:${(s.weight/T*100).toFixed(2)}%;background:${c};opacity:${Math.max(.45,1-i*.13).toFixed(2)};box-shadow:0 0 12px color-mix(in srgb,${c} 40%,transparent)"></i>`).join('');
  const w = L => L.reduce((a,s)=>a+s.weight,0).toFixed(1);
  const pos = 50 + Math.max(-1, Math.min(1, m.bias.score))*50;
  return `<div class="tug"><div class="track"><div class="side bear">${seg(dn,'var(--down)')}</div><div class="side bull">${seg(up,'var(--up)')}</div><i class="needle" style="left:${pos.toFixed(1)}%"></i></div>
    <div class="tl"><span>${dn.length} bearish, ${w(dn)}</span><span>${up.length} bullish, ${w(up)}</span></div></div>`;
}
const sgn = x => (x>=0?'+':'−') + Math.abs(x).toFixed(2);
function otherCalls(){
  if(!ROOT || !ROOT.ny) return [];
  const all = [['Open call','ny','preopen',ROOT.ny.preopen],['Now','ny','now',ROOT.ny.now],['Overnight','overnight','preopen',ROOT.overnight]];
  return all.filter(([,s,v,d]) => d && d.markets && d.markets[SYM] && !(s===SESSION && (s==='overnight' || v===VIEW)));
}
function bento(D, m, b, stale, window_){
  const L = m.levels||{}, R = m.expected_range, sigs = m.signals.filter(s=>s.directional!==false && s.weight>0);
  const T = sigs.reduce((a,s)=>a+s.weight,0)||1;
  const top = sigs.filter(s=>s.score).sort((a,c)=>c.weight-a.weight).slice(0,4);
  const bull = b.bias==='Bullish', tgt = bull ? L.call_wall : L.put_wall;
  const tile1 = tgt!=null && L.price!=null
    ? `<div class="lbl">Target</div><div class="tv num">${fmt(tgt,0)}</div><div class="ts">${bull?'Call wall':'Put wall'}, ${fmt(Math.abs(tgt-L.price),0)} pts ${tgt>L.price?'up':'down'}</div>`
    : R ? `<div class="lbl">Expected range</div><div class="tv num">${fmt(R.low,0)}–${fmt(R.high,0)}</div><div class="ts">±${fmt(R.move,0)} pts, one standard move</div>`
        : `<div class="lbl">Target</div><div class="tv">—</div><div class="ts">No dealer levels for this read</div>`;
  const tile2 = L.flip!=null

  return evs.length ? evs.map(e=>`<div class="ev"><div class="t">${esc(e.time)}</div><div>
      <span class="imp" title="${e.impact} impact" style="background:${e.impact==='High'?'var(--down)':'var(--amber)'}"></span>${esc(e.title)}
      ${(e.forecast||e.previous)?`<small>Forecast ${esc(e.forecast||'—')}, previous ${esc(e.previous||'—')}</small>`:''}</div></div>`).join('')
    : '<div class="ev"><div style="color:var(--dim)">No major US releases.</div></div>';
}

/* ───────── LEVELS ───────── */
function pageLevels(D){
  const m=D.markets[SYM], L=m.levels||{}, R=m.expected_range, Dl=m.dealer, F=m.flow;
  let h = `<div class="ptitle">Levels</div><div class="psub">${esc(SYM)} prices as of ${tET(new Date(D.as_of))}, ${dayOf(D.date)}. From CBOE open interest, mapped to futures.</div>`;
  h += `<section><h2>Key levels</h2><div class="card rows">
      <div class="r"><span>Futures at cutoff</span><span>${fmt(L.price)}</span></div>
      ${L.call_wall?`<div class="r"><span>Call wall<small>resistance</small></span><span style="color:var(--up)">${fmt(L.call_wall,0)}</span></div>`:''}
      ${L.flip?`<div class="r"><span>Gamma flip<small>range above, trend below</small></span><span>${fmt(L.flip)}</span></div>`:''}
      ${L.flip_close?`<div class="r"><span>Flip at 4 PM</span><span>${fmt(L.flip_close)}</span></div>`:''}
      ${L.put_wall?`<div class="r"><span>Put wall<small>support</small></span><span style="color:var(--down)">${fmt(L.put_wall,0)}</span></div>`:''}
      ${R?`<div class="r"><span>Expected range (1σ)</span><span>${fmt(R.low,0)} – ${fmt(R.high,0)}<small>± ${fmt(R.move,0)} pts</small></span></div>`:''}
      ${(L.majors||[]).map(x=>`<div class="r"><span>Major ${x.net_gex>0?'+γ':'−γ'} level</span><span style="color:${x.net_gex>0?'var(--up)':'var(--down)'}">${fmt(x.level,0)}</span></div>`).join('')}
    </div>
    <div class="btnrow"><button class="btn" id="copyLv">Copy levels</button></div></section>`;
  if(!L.flip && !L.call_wall) h += `<section><div class="card pad" style="color:var(--dim);font-size:14px;line-height:1.5">No dealer levels for this read: the free feed didn't have that morning's open interest. Price and the volatility range are still shown.</div></section>`;
  if(m.profile && m.profile.length) h += `<section><h2>Dealer gamma profile</h2><div class="card pad">${profile(m.profile,L)}</div></section>`;
  if(Dl){ const lg=Dl.net_gex_bn>0;
    h += `<section><h2>Dealer positioning <span class="pill" style="color:${lg?'var(--up)':'var(--down)'}">${lg?'Long gamma':'Short gamma'}</span></h2><div class="card rows">
      <div class="r"><span>Net GEX (per 1% move)</span><span style="color:${lg?'var(--up)':'var(--down)'}">${usd(Dl.net_gex_bn)}B</span></div>
      <div class="r"><span>Call ÷ put gamma</span><span>${fmt(Dl.call_put_gamma)}</span></div>
      <div class="r"><span>Dealer option delta</span><span>${usd(Dl.dealer_delta_bn,1)}B</span></div>
      <div class="r"><span>Charm hedge flow to close</span><span style="color:${Dl.charm_bn>0?'var(--up)':'var(--down)'}">${Dl.charm_bn>0?'Buy':'Sell'} ${usd(Math.abs(Dl.charm_bn))}B</span></div>
      <div class="r"><span>Vanna per +1 vol pt</span><span>${usd(Dl.vanna_bn_per_pt)}B Δ</span></div>
      <div class="r"><span>Chains used</span><span>${Dl.chains.join(' + ')}</span></div></div></section>`; }
  if(F && (F.calls_m+F.puts_m)>0){ const cp=(F.calls_m/(F.calls_m+F.puts_m)*100).toFixed(1);
    h += `<section><h2>Options flow, prior session</h2><div class="card pad">
      <div class="flowbar"><div style="width:${cp}%;background:var(--up)"></div><div style="flex:1;background:var(--down)"></div></div>
      <div class="fl"><span style="color:var(--up)">Calls $${fmt(F.calls_m,1)}M</span><span style="color:var(--down)">Puts $${fmt(F.puts_m,1)}M</span></div>
      <div class="rows" style="margin:12px calc(-1*var(--pad)) calc(-1*var(--pad));border-top:1px solid var(--line)">
      ${F.top.map(t=>`<div class="r"><span>${fmt(t.level,0)} ${t.side}s</span><span style="color:${t.side==='call'?'var(--up)':'var(--down)'}">$${fmt(t.premium/1e6,1)}M</span></div>`).join('')}</div></div></section>`; }
  return h;
}
function copyLevels(){
  const D=readFor(), m=D.markets[SYM], L=m.levels||{}, R=m.expected_range;
  const lines=[`${SYM} levels · ${D.date} · ${tET(new Date(D.as_of))} · ${m.bias.bias} (${m.bias.conviction})`];
  if(L.call_wall) lines.push(`Call wall ${fmt(L.call_wall,0)}`);
  if(L.flip) lines.push(`Gamma flip ${fmt(L.flip,2)}`);
  if(L.put_wall) lines.push(`Put wall ${fmt(L.put_wall,0)}`);
  (L.majors||[]).forEach(x=>lines.push(`Major ${x.net_gex>0?'+':'−'}γ ${fmt(x.level,0)}`));
  if(R) lines.push(`Range ${fmt(R.low,0)} – ${fmt(R.high,0)}`);
  const txt=lines.join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Levels copied'))
    .catch(()=>{ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); toast('Levels copied');}catch(e){} t.remove(); });
}
function profile(pts,L){
  const W=520,H=150,p=6, xs=pts.map(d=>d.px), ys=pts.map(d=>d.gex);
  const x0=Math.min(...xs),x1=Math.max(...xs),ym=Math.max(...ys.map(Math.abs))||1;
  const X=v=>p+(v-x0)/(x1-x0)*(W-2*p), Y=v=>H/2-v/ym*(H/2-14);
  const path=pts.map((d,i)=>(i?'L':'M')+X(d.px).toFixed(1)+','+Y(d.gex).toFixed(1)).join('');
  const area=path+`L${X(x1)},${H/2}L${X(x0)},${H/2}Z`;
  const vline=(v,c,t)=>v==null||v<x0||v>x1?'':`<line x1="${X(v)}" x2="${X(v)}" y1="10" y2="${H-4}" stroke="${c}" stroke-width="1.2" ${t==='now'?'':'stroke-dasharray="3 3"'}/><text x="${X(v)+3}" y="${t==='now'?H-8:12}" fill="${c}" font-size="10" font-family="-apple-system,system-ui,sans-serif">${t}</text>`;
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><clipPath id="cu"><rect width="${W}" height="${H/2}"/></clipPath><clipPath id="cd"><rect y="${H/2}" width="${W}" height="${H/2}"/></clipPath></defs>
    <path d="${area}" fill="var(--up)" opacity=".2" clip-path="url(#cu)"/><path d="${area}" fill="var(--down)" opacity=".2" clip-path="url(#cd)"/>
    <path d="${path}" fill="none" stroke="var(--text)" stroke-width="1.4" opacity=".8"/>
    <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line2)"/>${vline(L.flip,'var(--amber)','flip')}${vline(L.price,'var(--text)','now')}
  </svg><div class="meter-l" style="margin-top:6px"><span>${fmt(x0,0)}</span><span>long gamma above, short below</span><span>${fmt(x1,0)}</span></div>`;
}

/* ───────── MACRO ───────── */
const MACRO_NAMES = {'NQ=F':'Nasdaq futures','ES=F':'S&P futures','^N225':'Nikkei','^GDAXI':'DAX','^HSI':'Hang Seng',
  'ZN=F':'10Y T-note futures','ZT=F':'2Y T-note futures','DX-Y.NYB':'Dollar index','CL=F':'WTI crude','HYG':'High-yield bonds',
  'BTC-USD':'Bitcoin','VXX':'VXX (vol)','^VIX':'VIX','^VXN':'VXN','^VIX3M':'VIX 3-month','^TNX':'10Y yield'};
const MACRO_GROUPS = {'Equities':['NQ=F','ES=F','^N225','^GDAXI','^HSI'], 'Rates & dollar':['ZN=F','ZT=F','^TNX','DX-Y.NYB'],
  'Risk & commodities':['HYG','BTC-USD','CL=F'], 'Volatility':['VXX','^VIX','^VXN','^VIX3M']};
function pageMacro(D0){
  const D = readFor(SESSION==='overnight'?'ny':SESSION);   // macro tape follows the NY read
  const Dx = D || D0, tape=Dx.macro||{}, today=todayET();
  let h = `<div class="ptitle">Macro</div><div class="psub">Prices at ${tET(new Date(Dx.as_of))}, ${dayOf(Dx.date)}, vs the prior 4 PM close.</div>`;
  for(const [g,list] of Object.entries(MACRO_GROUPS)){
    const rows=list.filter(k=>tape[k]);
    if(!rows.length) continue;
    h += `<section><h2>${g}</h2><div class="card rows">${rows.map(k=>{ const v=tape[k];
      return `<div class="r"><span>${MACRO_NAMES[k]}</span><span style="color:${v.chg_pct>0?'var(--up)':v.chg_pct<0?'var(--down)':'var(--text)'}">${v.chg_pct>0?'+':''}${fmt(v.chg_pct)}%<small>${fmt(v.last, v.last>1000?0:2)}${v.ts?', '+tET(new Date(v.ts)):''}</small></span></div>`;}).join('')}</div></section>`;
  }
  const macroSigs = (Dx.markets[SYM]||{signals:[]}).signals.filter(s=>s.group!=='Dealer positioning');
  if(macroSigs.length) h += `<section><h2>Macro votes for ${esc(SYM)}</h2><div class="card">${macroSigs.map(s=>{
    return `<div class="sig"><div class="sig-h"><h3>${esc(s.label)}</h3>${vbar(s)}</div>${P.reasons?`<p>${esc(lead(s.text))}</p>`:''}</div>`;}).join('')}</div></section>`;
  const week = ROOT.week || Dx.events || [];
  if(week.length){
    const byDay={}; week.forEach(e=>(byDay[e.date||Dx.date]=byDay[e.date||Dx.date]||[]).push(e));
    h += `<section><h2>Week ahead</h2><div class="card">${Object.entries(byDay).map(([d,evs])=>
      `<div class="dayhead ${d===today?'today':''}">${dayOf(d)}${d===today?', today':''}</div>${eventsHTML(evs)}`).join('')}</div></section>`;
  } else h += `<section><h2>Week ahead</h2><div class="card">${eventsHTML([])}</div></section>`;
  const ern=(Dx.markets[SYM]||{}).earnings||[];
  if(ern.length) h += `<section><h2>Mega-cap earnings</h2><div class="card rows">${ern.map(e=>`<div class="r"><span>${esc(e.symbol)}</span><span>${esc(e.when)}</span></div>`).join('')}</div></section>`;
  return h;
}

/* ───────── RECORD ───────── */
function pageRecord(D){
  const sc=(D.markets[SYM]||{}).scorecard, sess=SESSION==='overnight'?'overnight calls, graded 2 to 8 AM CT':VIEW==='now'?'Now calls, each graded to its session close':'pre-open calls, graded 8:30 to 9:00 CT';
  let h = `<div class="ptitle">Record</div><div class="psub">${esc(SYM)} ${sess}, on the futures move.</div>`;
  if(!sc || (!sc.hits && !sc.misses && !(sc.recent||[]).length))
    return h+`<section><div class="card pad" style="color:var(--dim);font-size:14px;line-height:1.55">Nothing graded yet. Calls are graded when their window ends. To fill this in faster, rebuild past dates in GitHub: Actions, Morning bias report, Run workflow, then enter a date.</div></section>`;
  const pc = v => v==null?'—':v+'%';
  const st = sc.streak||{};
  h += `<section class="big"><div><span>Hit rate</span><b style="color:${(sc.pct??0)>=50?'var(--up)':'var(--down)'}">${pc(sc.pct)}</b><small>${sc.hits} right, ${sc.misses} wrong</small></div>
        <div><span>Streak</span><b style="color:${st.kind==='hit'?'var(--up)':'var(--down)'}">${st.n||0}</b><small>${st.kind==='hit'?'in a row right':st.kind==='miss'?'in a row wrong':'—'}</small></div></section>`;
  const barRow=(label,r)=>`<div class="r" style="display:block"><div style="display:flex;justify-content:space-between"><span style="color:var(--dim)">${label}</span><span style="font-family:var(--mono);font-weight:600">${pc(r.pct)} <small style="display:inline">${r.hits}–${r.misses}</small></span></div>
     <div class="bar"><i style="width:${r.pct??0}%;background:${(r.pct??0)>=50?'var(--up)':'var(--down)'}"></i></div></div>`;
  h += `<section><h2>By call</h2><div class="card rows">${barRow('Bullish calls',sc.by_bias.Bullish)}${barRow('Bearish calls',sc.by_bias.Bearish)}</div></section>`;
  h += `<section><h2>By conviction</h2><div class="card rows">${['High','Medium','Low','Very low'].filter(c=>sc.by_conviction[c]).map(c=>barRow(c+' conviction',sc.by_conviction[c])).join('')}</div></section>`;
  const recent=sc.recent||[];
  h += `<section><h2>Last ${recent.length} sessions</h2><div class="card"><div class="dots">${recent.map(r=>`<span title="${r.date}" style="background:${r.result==='hit'?'var(--up)':r.result==='miss'?'var(--down)':'var(--line2)'}">${r.bias[0]}</span>`).join('')}</div>
    <div class="psub" style="padding:0 var(--pad) var(--pad);font-size:12px">Green was right, red was wrong, grey wasn't graded. The letter is the call.</div></div></section>`;
  if((sc.signals||[]).length) h += `<section><h2>Which signals worked</h2><div class="card rows">${sc.signals.map(s=>
    `<div class="r" style="display:block"><div style="display:flex;justify-content:space-between"><span style="color:var(--dim)">${esc(s.label)}</span><span style="font-family:var(--mono);font-weight:600">${s.pct}% <small style="display:inline">${s.right}/${s.n}</small></span></div>
     <div class="bar"><i style="width:${s.pct}%;background:${s.pct>=55?'var(--up)':s.pct<=45?'var(--down)':'var(--flat)'}"></i></div></div>`).join('')}</div>
     <div class="psub" style="margin-top:8px;font-size:12px">How often each vote pointed the way price went. Over 55% earns its weight, under 45% is worse than a coin flip. Give it a few weeks before trusting it.</div></section>`;
  h += `<section><h2>History</h2><div class="card rows">${recent.slice().reverse().map(r=>`<div class="r"><span>${dayOf(r.date)}<small>${r.conviction} conviction</small></span>
    <span style="color:${r.result==='hit'?'var(--up)':r.result==='miss'?'var(--down)':'var(--dim)'}">${r.bias}, ${r.move>0?'+':''}${fmt(r.move,0)}<small>${r.result==='hit'?'right':r.result==='miss'?'wrong':'not counted'}</small></span></div>`).join('')}</div></section>`;
  return h;
}

/* ───────── RED FOLDER ───────── */
const FOLDER = c => `<svg viewBox="0 0 24 24" width="16" height="16" style="flex:none"><path fill="${c}" d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>`;
function pageRed(){
  const R = ROOT && ROOT.red;
  let h = `<div class="ptitle">Red folder</div><div class="psub">This week's high-impact US releases, and where CPI and the Fed are likely to land. Built from macro data only.</div>`;
  if(!R) return h + `<section><div class="card pad" style="color:var(--dim)">No previews yet. They're built with the next run.</div></section>`;
  for(const key of ['fomc','cpi']){

    h += `<section><h2>${p.name} <span class="pill" style="color:${p.scheduled?'var(--down)':'var(--dim)'}">${sch}</span></h2>
      <div class="hero" style="margin-top:0">
        <div class="kicker">${FOLDER('var(--down)')}${key==='cpi'?'Expected print':'Expected tone'}: ${esc(p.lean)}</div>
        <div class="bias" style="--c:${C(p.call)};font-size:50px">${p.call}</div>
        <div class="conv"><span class="chip">${p.conviction} conviction</span><span class="chip" style="color:${C(p.call)}">${p.call==='Bearish'?'−':'+'}${Math.abs(p.score).toFixed(2)}</span>${p.priced?`<span class="chip" style="color:var(--dim)">Priced: ${esc(p.priced)}</span>`:''}</div>
        <p class="note">${esc(p.why)}</p>
      </div>
      <div class="card" style="margin-top:10px">${p.votes.map(v=>`<div class="sig"><div class="sig-h"><h3>${esc(v.label)}<span class="w">×${v.weight}</span></h3>${vbar({...v, score:-v.score})}</div>${P.reasons?`<p>${esc(v.text)}</p>`:''}</div>`).join('')}</div></section>`;
  }
  const ev = R.events||[];
  if(ev.length){ const byDay={}; ev.forEach(e=>(byDay[e.date]=byDay[e.date]||[]).push(e)); const today=todayET();
    h += `<section><h2>This week</h2><div class="card">${Object.entries(byDay).map(([d,evs])=>
      `<div class="dayhead ${d===today?'today':''}">${dayOf(d)}${d===today?', today':''}</div>${eventsHTML(evs)}`).join('')}</div></section>`; }
  else h += `<section><h2>This week</h2><div class="card">${eventsHTML([])}</div></section>`;
  h += `<section class="foot"><p>Red bars push the call bearish (a hotter print or a more hawkish Fed). Green bars push it bullish. These are previews, not guarantees: the release itself can still surprise.</p></section>`;
  return h;
}

/* ───────── NEWS ───────── */
let NEWS = null, NEWS_SRC = 'All', NEWS_AT = 0;
async function loadNews(){
  try{ const r = await fetch('data/news.json?t='+Date.now(), {cache:'no-store'}); NEWS = await r.json(); NEWS_AT = Date.now(); }
  catch(e){ NEWS = NEWS || {items:[], error:true}; }
  if(PAGE==='news') render();
}
const nAgo = iso => { const m = Math.max(0, Math.round((Date.now()-new Date(iso))/60000)); return m<60 ? m+'m ago' : m<1440 ? Math.floor(m/60)+'h ago' : Math.floor(m/1440)+'d ago'; };
function pageNews(){
  if(!NEWS || Date.now()-NEWS_AT > 5*60e3){ loadNews(); }
  let h = `<div class="ptitle">News</div><div class="psub">Market headlines from Fox Business, CNBC, Yahoo Finance, MarketWatch and Investing.com. Tap one to read it on the publisher's site.</div>`;
  if(!NEWS) return h + `<section><div class="card pad" style="color:var(--sub)">Loading headlines…</div></section>`;
  const all = NEWS.items||[]; const srcs = ['All', ...new Set(all.map(i=>i.source))];
  const items = all.filter(i=>NEWS_SRC==='All' || i.source===NEWS_SRC);
  if(!items.length) return h + `<section><div class="card pad" style="color:var(--sub)">${NEWS.error?'Couldn\'t load headlines. Pull to refresh.':'No headlines yet. They refresh every hour.'}</div></section>`;
  const img = (u,cls) => u ? `<img ${cls||''} src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : '';
  const meta = i => `<div class="nw-meta"><b>${esc(i.source)}</b><span>${i.ts?nAgo(i.ts):''}</span></div>`;
  const [top, ...rest] = items;
  h += `<div class="nw-chips">${srcs.map(x=>`<button data-src="${esc(x)}" class="${x===NEWS_SRC?'on':''}">${esc(x)}</button>`).join('')}</div>`;
  h += `<a class="nw nw-hero" href="${esc(top.link)}" target="_blank" rel="noopener">${img(top.image)}<div class="nb"><h3>${esc(top.title)}</h3>${top.summary?`<div class="nw-sum">${esc(top.summary)}</div>`:''}${meta(top)}</div></a>`;
  h += `<div class="card pad" style="padding-top:4px;padding-bottom:4px">${rest.map(i=>`<a class="nw nw-row" href="${esc(i.link)}" target="_blank" rel="noopener"><div class="nb"><h4>${esc(i.title)}</h4>${meta(i)}</div>${img(i.image)}</a>`).join('')}</div>`;
  h += `<section class="foot"><p>Updated ${nAgo(NEWS.generated)}. Headlines link to the original articles; this app doesn't read them for its calls.</p></section>`;
  return h;
}
function wireNews(){ $$('.nw-chips button').forEach(b=>b.onclick=()=>{ NEWS_SRC=b.dataset.src; render(); }); }

/* ───────── GAMMA MAP ───────── */
function pageGammaMap(){
  const rows = ((ROOT && ROOT.gamma_map) || {})[SYM] || [];
  let h = `<div class="ptitle">Gamma map</div><div class="psub">${esc(SYM)} dealer levels from each morning's pre-open read: are the walls and flip moving up or down?</div>`;
  if(rows.length < 2) return h + `<section><div class="card pad" style="color:var(--sub)">${rows.length?'One morning so far.':'No mornings with options data yet.'} The map fills in as each pre-open read locks.</div></section>` + (rows.length?gmTable(rows):'');
  const W=340, H=200, P=30, vals = rows.flatMap(r=>[r.call_wall,r.put_wall,r.flip,r.price]).filter(v=>v!=null);
  const lo=Math.min(...vals), hi=Math.max(...vals), pad=(hi-lo)*0.08||10;
  const x = i => P + i*(W-P-8)/(rows.length-1), y = v => 8 + (1-(v-lo+pad)/(hi-lo+2*pad))*(H-28);
  const line = (k,col,dash) => { const pts = rows.map((r,i)=>r[k]!=null?`${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`:null).filter(Boolean);
    return pts.length>1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" ${dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>` : ''; };
  const dots = rows.map((r,i)=>r.price!=null?`<circle cx="${x(i).toFixed(1)}" cy="${y(r.price).toFixed(1)}" r="3" fill="var(--text)"/>`:'').join('');
  const ticks = [hi, (hi+lo)/2, lo].map(v=>`<text x="2" y="${y(v)+4}" font-size="10" fill="var(--dim)">${fmt(v,0)}</text>`).join('');
  const dl = rows.map((r,i)=> (i===0||i===rows.length-1||i%Math.ceil(rows.length/5)===0) ? `<text x="${x(i)}" y="${H-4}" font-size="10" fill="var(--dim)" text-anchor="${i===rows.length-1?'end':i===0?'start':'middle'}">${r.date.slice(5).replace('-','/')}</text>`:'').join('');
  h += `<section><div class="card pad"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${ticks}${line('call_wall','var(--up)')}${line('put_wall','var(--down)')}${line('flip','var(--amber)',1)}${dots}${dl}</svg>

function squarify(items, x, y, w, h){   // items: [{v,...}] sorted desc → [{...,x,y,w,h}]
  const out=[]; let rest=items.slice(), X=x, Y=y, W=w, H=h;
  const total = a => a.reduce((s,i)=>s+i.v,0);
  while(rest.length){
    const side = Math.min(W,H), S = total(rest); let row=[], best=Infinity;
    for(const it of rest){ const r=[...row,it], rs=total(r), a=rs/S*W*H, len=a/side;
      const worst=Math.max(...r.map(i=>{ const s=i.v/rs*side; return Math.max(len/s, s/len); }));
      if(worst<=best){ row=r; best=worst; } else break; }
    const rs=total(row), a=rs/S*W*H, len=a/side; let off=0;
    for(const it of row){ const s=it.v/rs*side;
      out.push(W>=H ? {...it, x:X, y:Y+off, w:len, h:s} : {...it, x:X+off, y:Y, w:s, h:len}); off+=s; }
    if(W>=H){ X+=len; W-=len; } else { Y+=len; H-=len; }
    rest = rest.slice(row.length);
  }
  return out;
}

  const W=360, HH=420, tiles = squarify(H.map(i=>({...i, v:i.weight})), 0, 0, W, HH);

  Seoul:['Asia/Seoul',540,930,'1-5'], Sydney:['Australia/Sydney',600,960,'1-5'], Mumbai:['Asia/Kolkata',555,930,'1-5'], Riyadh:['Asia/Riyadh',600,900,'0-4'],

function mktOpen(city){
  const m = MKT_HOURS[city]; if(!m) return null;
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:m[0],hourCycle:'h23',weekday:'short',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday), t=(+p.hour%24)*60 + +p.minute, [a,b]=m[3].split('-').map(Number);
  return wd>=a && wd<=b && t>=m[1] && t<m[2];
}

    <div class="r" style="display:block"><b style="font-weight:600">Now · New York</b><div style="color:var(--sub);font-size:13.5px;margin-top:3px">9 AM to 3 PM CT. Built before 9.</div></div>
    <div class="r" style="display:block"><b style="font-weight:600">Sunday gap</b><div style="color:var(--sub);font-size:13.5px;margin-top:3px">Friday's close to Sunday's 5 PM CT reopen, in points. Locks at 4:55 PM Sunday.</div></div></div></section>`;
  h += `<section><h2>Reading a call</h2><div class="card pad" style="font-size:14px;color:var(--sub);line-height:1.5">
    <p style="margin:0 0 8px"><b style="color:var(--text)">Bullish or Bearish</b> is the side the votes lean. Every call picks a side.</p>
    <p style="margin:0 0 8px"><b style="color:var(--text)">Conviction</b> is how strong the lean is compared with the model's own past reads: High is the top 10%. Low or Very low is close to a coin flip, so size down.</p>
    <p style="margin:0 0 8px"><b style="color:var(--text)">The bar</b> shows the votes: red pulling bearish, green bullish, the white marker where they net out.</p>
    <p style="margin:0 0 8px"><b style="color:var(--text)">Flips at</b> is the gamma flip. Above it dealers damp moves; below it they amplify them.</p>
    <p style="margin:0">On days with a big release (CPI, jobs, Fed), conviction is capped at Low until it's out. Check <b style="color:var(--text)">Record</b> to see how each call has actually done.</p></div></section>`;
  h += `<section><h2>Every page</h2><div class="card">${Object.entries(PAGES).filter(([k])=>k!=='help').map(([k,v])=>`<button class="hp" data-go-page="${k}"><span class="hpi">${I[k]||''}</span><span class="hpt"><b style="font-weight:600">${v.name}</b><div style="color:var(--sub);font-size:13px;margin-top:2px">${HELP[k]||v.sub}</div></span></button>`).join('')}</div></section>`;
  h += `<section class="foot"><p>Find any page under More (bottom right), with search. Switch NQ and ES at the top left. The circular arrow refreshes; the gear changes colors and settings. Not financial advice.</p></section>`;
  return h;
}

function pageGap(){
  const G = ROOT && ROOT.gap, m = G && G.markets && G.markets[SYM];
  let h = `<div class="ptitle">Sunday gap</div><div class="psub">Friday's 4 PM CT close to the 5 PM CT Sunday reopen, called from what moves over the weekend.</div>`;
  if(!m) return h + `<section><div class="card pad" style="color:var(--sub)">No gap read yet. It starts building Friday after 3 PM CT and locks Sunday at 4:55 PM CT.</div></section>`;
  const lbl = new Date(G.sunday+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const o = m.outcome, state = o ? 'Result' : G.locked ? 'Locked' : 'Preview';
  const pts = v => (v>0?'+':v<0?'−':'')+fmt(Math.abs(v),0)+' pts';
  const col = x => x>0?'var(--up)':x<0?'var(--down)':'var(--sub)';
  h += `<section><div class="card pad">
    <div class="lbl" style="color:var(--dim);font-size:13px">${esc(SYM)} · Sunday ${lbl} reopen · ${state}${G.locked||o?'':', locks 4:55 PM CT'}</div>
    <div class="hero-row" style="display:flex;align-items:center;gap:10px;margin-top:6px"><div class="callword" style="color:${C(m.bias)}">${m.bias}</div><span class="chip conv-pill">${m.conviction} conviction</span></div>
    <div class="num" style="font-size:34px;font-weight:700;margin-top:8px;color:${col(m.pred_pts)}">${pts(m.pred_pts)}</div>
    <div style="color:var(--sub);font-size:13.5px;margin-top:4px">Expected gap from Friday's close of ${fmt(m.friday_close,0)}. A typical weekend gap is ±${fmt(m.typical_pts,0)} pts (median of ${m.weekends} weekends).</div></div></section>`;
  if(o) h += `<section><h2>Result <span class="pill" style="color:${o.result==='hit'?'var(--up)':'var(--down)'}">${o.result==='hit'?'Right':'Wrong'}</span></h2><div class="card rows">
    <div class="r"><span>Friday close</span><span class="num">${fmt(m.friday_close)}</span></div><div class="r"><span>Sunday open</span><span class="num">${fmt(o.open)}</span></div>
    <div class="r"><span>Actual gap</span><span class="num" style="color:${col(o.gap_pts)}">${pts(o.gap_pts)}</span></div><div class="r"><span>Called</span><span class="num" style="color:${col(m.pred_pts)}">${pts(m.pred_pts)}</span></div></div></section>`;
  h += `<section><h2>Why</h2><div class="card rows">${(m.signals||[]).map(s=>`<div class="r" style="display:block"><div style="display:flex;justify-content:space-between"><b style="font-weight:600">${esc(s.label)}</b><span style="color:${col(s.score)}">${s.score>0?'Bullish':s.score<0?'Bearish':'No vote'}</span></div><div style="color:var(--sub);font-size:13px;margin-top:3px">${esc(s.text)}</div></div>`).join('') || '<div class="r"><span>No weekend data yet.</span></div>'}</div></section>`;
  const rec = (G.record||[]).filter(r=>r.sym===SYM).slice().reverse();
  if(rec.length){ const hit=rec.filter(r=>r.result==='hit').length;
    h += `<section><h2>Record <span class="pill">${hit} of ${rec.length} right</span></h2><div class="card rows">${rec.map(r=>`<div class="r"><span>${new Date(r.sunday+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span><span class="num">called ${pts(r.pred_pts)} · got <b style="color:${col(r.gap_pts)}">${pts(r.gap_pts)}</b></span></div>`).join('')}</div></section>`; }
  h += `<section class="foot"><p><b>How it works.</b> Size comes from ${esc(SYM)}'s own past weekends: the typical gap, and how much Bitcoin's weekend move has carried into it (each 1% in Bitcoin has meant ${fmt(m.beta_btc,2)}% in ${esc(SYM)}). Direction adds the Saudi market's Sunday session and the model's last Friday read on macro and options. It previews from Friday afternoon and locks at 4:55 PM CT Sunday.</p></section>`;
  return h;
}
